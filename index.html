/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,

      function(char){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[char];

      }
    );

}


/* =========================
   LEVENSHTEIN
========================= */

function levenshtein(a,b){

  a =
    a.toLowerCase();

  b =
    b.toLowerCase();


  const previous =
    Array.from(
      {length:b.length + 1},
      (_,i) => i
    );


  for(
    let i=1;
    i<=a.length;
    i++
  ){

    const current = [i];


    for(
      let j=1;
      j<=b.length;
      j++
    ){

      current[j] =
        Math.min(

          current[j-1] + 1,

          previous[j] + 1,

          previous[j-1] +
          (
            a[i-1] === b[j-1]
              ? 0
              : 1
          )

        );

    }


    for(
      let j=0;
      j<current.length;
      j++
    ){

      previous[j] =
        current[j];

    }

  }


  return previous[b.length];

}

  const q =
    query
      .toLowerCase()
      .trim();


  if(title === q){
    return 100;
  }


  if(title.includes(q)){
    return 92;
  }


  if(type.includes(q)){
    return 75;
  }


  if(genre.includes(q)){
    return 70;
  }


  const words =
    title.split(/\s+/);


  const qWords =
    q
      .split(/\s+/)
      .filter(Boolean);


  let best = 0;


  const wholeDistance =
    levenshtein(
      title,
      q
    );


  const wholeMax =
    Math.max(
      title.length,
      q.length
    );


  if(wholeMax){

    best =
      Math.max(
        best,

        100 -
        (
          wholeDistance /
          wholeMax
        ) * 100
      );

  }


  for(const qw of qWords){

    for(const w of words){

      if(
        w.startsWith(qw) ||
        qw.startsWith(w)
      ){

        best =
          Math.max(
            best,
            88
          );

      }


      const distance =
        levenshtein(
          qw,
          w
        );


      const max =
        Math.max(
          qw.length,
          w.length
        );


      if(max >= 3){

        best =
          Math.max(

            best,

            100 -
            (
              distance /
              max
            ) * 100

          );

      }

    }

  }


  return best;

}

function renderChips(){

  const categories = [
    "All",
    "Movie",
    "Web Series",
    "TV Show",
    "18+",
    "Hollywood",
  ];

  chips.innerHTML = categories.map(category => `

      data-category="${escapeHtml(category)}"
    >

  `).join("");

  chips.querySelectorAll(".chip").forEach(button => {

      renderChips();
      render();
    };

function movieCategory(movie){

  const type =
    String(movie.contentType || "")
      .toLowerCase()
      .replace(/[\\s_-]/g,"");

  const category =
    String(
      movie.category ||
      movie.industry ||
      movie.type ||
      ""
    ).toLowerCase();

  const genre =
    String(movie.genre || "").toLowerCase();

  if(
    genre.split(/[|,/]+/).some(
      g => g.trim() === "18+"
    ) ||
    category.includes("18+")
  ){
    return "18+";
  }

  if(
    category.includes("hollywood") ||
    category.includes("holly wood")
  ){
    return "Hollywood";
  }

  if(
    type === "webseries" ||
    type === "series"
  ){
    return "Web Series";
  }

  if(
    type === "tvshow" ||
    type === "television"
  ){
    return "TV Show";
  }

  return "Movie";
}


function getFilteredMovies(){

  let list =
    [...movies];


  const q =
    search.value
      .trim()
      .toLowerCase();

  if(activeGenre === "All"){

    list =
      list.filter(
        movie =>
          movieCategory(movie) !== "18+"
      );

  }else{

    list =
      list.filter(
        movie =>
          movieCategory(movie) === activeGenre
      );

  }

  if(q){

    list =

      list

        .map(movie => ({

          ...movie,

          __score:
            searchScore(
              movie,
              q
            )

        }))

        .filter(
          movie =>
            movie.__score >= 55
        )

        .sort(
          (a,b) =>
            b.__score -
            a.__score
        );

  }



  /* SORT */

  if(!q){

    if(sort.value === "new"){
      list.sort(
        (a,b) =>
          new Date(b.addedAt || 0).getTime() -
          new Date(a.addedAt || 0).getTime()
      );
    }

    if(sort.value === "old"){
      list.sort(
        (a,b) =>
          new Date(a.addedAt || 0).getTime() -
          new Date(b.addedAt || 0).getTime()
      );
    }

    if(sort.value === "az"){
      list.sort((a,b) =>
        String(a.title || "").localeCompare(String(b.title || ""))
      );
    }

    if(sort.value === "za"){
      list.sort((a,b) =>
        String(b.title || "").localeCompare(String(a.title || ""))
      );
    }

  }

  return list;

}


/* =========================
   PAGINATION
========================= */

function renderPagination(
  totalPages
){

  if(totalPages <= 1){

    pagination.innerHTML = "";

    return;

  }


  const items = [];


  items.push(`

    <button

      class="page-btn"

      ${
        currentPage === 1
          ? "disabled"
          : ""
      }

      data-page="${
        currentPage - 1
      }"

    >

      ‹ Prev

    </button>

  `);


  const pages = [];


  if(totalPages <= 7){

    for(
      let i=1;
      i<=totalPages;
      i++
    ){

      pages.push(i);

    }

  }else{

    pages.push(1);


    if(
      currentPage > 4
    ){

      pages.push(
        "dots-left"
      );

    }


    const from =
      Math.max(
        2,
        currentPage - 1
      );


    const to =
      Math.min(
        totalPages - 1,
        currentPage + 1
      );


    for(
      let i=from;
      i<=to;
      i++
    ){

      pages.push(i);

    }


    if(
      currentPage <
      totalPages - 3
    ){

      pages.push(
        "dots-right"
      );

    }


    pages.push(
      totalPages
    );

  }


  pages.forEach(page => {

    if(
      typeof page ===
      "string"
    ){

      items.push(`

        <span
          class="page-dots"
        >
          …
        </span>

      `);

    }else{

      items.push(`

        <button

          class="page-btn ${
            page === currentPage
              ? "active"
              : ""
          }"

          data-page="${page}"

        >

          ${page}

        </button>

      `);

    }

  });


  items.push(`

    <button

      class="page-btn"

      ${
        currentPage ===
        totalPages
          ? "disabled"
          : ""
      }

      data-page="${
        currentPage + 1
      }"

    >

      Next ›

    </button>

  `);


  pagination.innerHTML =
    items.join("");


  pagination
    .querySelectorAll(
      "[data-page]"
    )
    .forEach(button => {

      button.onclick = () => {

        const page =
          Number(
            button.dataset.page
          );


        if(
          page >= 1 &&
          page <= totalPages
        ){

          currentPage =
            page;

          render();


          document
            .getElementById(
              "movies"
            )
            .scrollIntoView({

              behavior:
                "smooth",

              block:
                "start"

            });

        }

      };

    });

}

    Math.max(

      Math.ceil(
        filtered.length /
        PER_PAGE
      )

    );


  if(
    currentPage >
    totalPages
  ){

    currentPage =
      totalPages;

  }


  const start =

      currentPage - 1
    ) *
    PER_PAGE;


  const list =
    filtered.slice(

    );


  /* =========================

    list.length === 0

            const isSeries =

                      )
                    }"

                    alt="${
                      escapeHtml(

                        "Movie"
                      )
                    } poster"

                    loading="lazy"

                    onerror="
                      this.style.opacity='.25'
                    "

                  >


                  <div
                    class="overlay"
                  ></div>


                  <div
                    class="badges"
                  >


                    <span
                      class="badge"
                    >

                      ${
                        escapeHtml(
                          movie.year ||
                          ""
                        )
                      }

                    </span>


                    <span
                      class="badge type-badge"
                    >

                      ${
                        typeText
                      }

                    </span>


                  </div>


                  <div
                    class="play"
                  >

                    ▶

                  </div>


                </div>


                <div
                  class="info"
                >


                  <div

                    class="title"

                    title="${
                      escapeHtml(
                        movie.title ||
                        ""
                      )
                    }"

                  >

                    ${
                      escapeHtml(
                        movie.title ||
                        "Untitled"
                      )
                    }

                  </div>


                  <div
                    class="meta"
                  >

                    <span>

                      ${
                        escapeHtml(
                          movie.genre ||
                          "Movie"
                        )
                      }

                    </span>


                    ${
                      isSeries &&
                      episodeCount > 0

                      ?

                      `

                      <span>
                        •
                      </span>

                      <span>
                        ${
                          episodeCount
                        }
                        Episodes
                      </span>

                      `

                      :

                      ""

                    }

                  </div>


                </div>


              </article>

            `;

          }

        )
        .join("");

  }


  /* =========================
     COUNT
  ========================== */

  count.textContent =

    search.value.trim()

      ?

      `${filtered.length}
       matching title${
         filtered.length === 1
           ? ""
           : "s"
       }`

      :

      `${filtered.length}
       title${
         filtered.length === 1
           ? ""
           : "s"
       }`;


  /* =========================
     EMPTY
  ========================== */

  empty.style.display =
    filtered.length
      ? "none"
      : "block";


  /* =========================
     PAGINATION
  ========================== */

  renderPagination(
    totalPages
  );


  /* =========================
     CARD CLICK
  ========================== */

  grid
    .querySelectorAll(
      ".movie"
    )
    .forEach(
      (card,index) => {

        const movie =
          list[index];


        const openMovie =
          () => {

            if(

              !movie ||

              movie.id ===
                undefined ||

              movie.id ===
                null ||

              String(
                movie.id
              ).trim() === ""

            ){

              showToast(
                "Movie/Series ID not found in movies.json"
              );

              console.error(
                "ID missing:",
                movie
              );

              return;

            }


            const id =
              encodeURIComponent(
                String(
                  movie.id

              );


            window.location.href =
              `movie.html?id=${id}`;

          };


        card.addEventListener(
          "click",
          openMovie
        );


        card.addEventListener(
          "keydown",
          event => {

            if(

              event.key ===
                "Enter" ||

              event.key ===
                " "

            ){

              event.preventDefault();

              openMovie();

            }

          }
        );

      }
    );

}

/* =========================

========================= */

let tickerX = 0;
let tickerSpeed = 0.35;

let tickerAnimation = null;

let tickerDragging = false;

let tickerStartX = 0;
let tickerStartPosition = 0;


function renderTicker(){

  if(!movieTicker){
    return;
  }


  const latest =
    [...movies]
      .filter(
        movie =>
          movieCategory(movie) !== "18+"
      )
      .sort(
        (a,b) =>
          new Date(b.addedAt || 0).getTime() -
          new Date(a.addedAt || 0).getTime()
      )
      .slice(0,20);


  const items =
    [...latest,...latest]
      .map(movie => `

        <a
          class="ticker-item"
          href="movie.html?id=${encodeURIComponent(String(movie.id))}"
          title="${escapeHtml(movie.title || "")}"
        >

          <img
            src="${escapeHtml(movie.poster || "")}"
            alt="${escapeHtml(movie.title || "Movie")}"
            loading="lazy"
          >

        </a>

      `)
      .join("");


  movieTicker.innerHTML = items;


  startTickerMovement();

  enableTickerDrag();

}


/* =========================
   AUTOMATIC MOVEMENT
========================= */

function startTickerMovement(){

  if(tickerAnimation){

    cancelAnimationFrame(
      tickerAnimation
    );

  }


  function move(){

    if(!tickerDragging){

      tickerX -= tickerSpeed;

      const track =
        document.getElementById(
          "movieTicker"
        );


      if(track){

        const halfWidth =
          track.scrollWidth / 2;


        if(
          Math.abs(tickerX) >=
          halfWidth
        ){

          tickerX = 0;

        }


        track.style.transform =
          `translateX(${tickerX}px)`;

      }

    }


    tickerAnimation =
      requestAnimationFrame(move);

  }


  move();

}


/* =========================
   MANUAL DRAG / SWIPE
========================= */

function enableTickerDrag(){

  const ticker =
    document.querySelector(
      ".movie-ticker"
    );

  const track =
    document.getElementById(
      "movieTicker"
    );


  if(!ticker || !track){
    return;
  }


  ticker.onpointerdown =
    function(event){

      tickerDragging = true;

      tickerStartX =
        event.clientX;

      tickerStartPosition =
        tickerX;


      ticker.classList.add(
        "dragging"
      );


      ticker.setPointerCapture(
        event.pointerId
      );

    };


  ticker.onpointermove =
    function(event){

      if(!tickerDragging){
        return;
      }


      const movement =
        event.clientX -
        tickerStartX;


      tickerX =
        tickerStartPosition +
        movement;


      const halfWidth =
        track.scrollWidth / 2;


      if(
        tickerX > 0
      ){

        tickerX =
          -halfWidth;

      }


      if(
        tickerX < -halfWidth
      ){

        tickerX =
          0;

      }


      track.style.transform =
        `translateX(${tickerX}px)`;

    };


  ticker.onpointerup =
    function(event){

      tickerDragging = false;

      ticker.classList.remove(
        "dragging"
      );


      try{

        ticker.releasePointerCapture(
          event.pointerId
        );

      }catch(error){}

    };


  ticker.onpointercancel =
    function(){

      tickerDragging = false;

      ticker.classList.remove(
        "dragging"
      );

    };

}


/* =========================
   LOAD MOVIES.JSON
========================= */

async function loadMovies(){

  try{

    showToast(
      "Loading movies & series..."
    );


    const response =
      await fetch(
        "movies.json",
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();


    if(
      !Array.isArray(data)
    ){

      throw new Error(
        "movies.json must contain an array"
      );

    }


    movies =
      data;

    renderTicker();


    /* =========================
       CHECK IDS
    ========================== */

    const missingIds =
      movies.filter(

        movie =>

          movie.id ===
            undefined ||

          movie.id ===
            null ||

          String(
            movie.id
          ).trim() === ""

      );


    if(
      missingIds.length > 0
    ){

      console.warn(
        "Some items are missing IDs:",
        missingIds
      );

    }


    renderChips();

    render();


  }catch(error){

    console.error(
      "Movie loading error:",
      error
    );


    movies = [];


    renderChips();

    render();


    empty.style.display =
      "block";


    empty.textContent =
      "movies.json could not be loaded. Make sure movies.json is next to index.html.";


    showToast(
      "movies.json could not be loaded."
    );

  }

}
