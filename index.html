
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff4fa">

<title>K-DRAMA HUB — Korean & Chinese Dramas</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --pink:#ff75ad;
  --pink2:#ff9fc9;
  --blue:#78cfff;
  --purple:#b99cff;
  --text:#30303b;
  --muted:#777889;
  --white:#ffffff;
  --line:#eee3ec;
  --bg:#fff8fc;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  min-height:100vh;

  background:
    radial-gradient(650px 400px at 5% 5%,rgba(255,117,173,.20),transparent 70%),
    radial-gradient(650px 450px at 95% 10%,rgba(120,207,255,.20),transparent 70%),
    radial-gradient(600px 450px at 50% 100%,rgba(185,156,255,.14),transparent 70%),
    linear-gradient(135deg,#fff8fc,#f7fbff);
}

a{
  text-decoration:none;
  color:inherit;
}

/* FLOATING BACKGROUND */

body::before,
body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  filter:blur(2px);
  pointer-events:none;
  z-index:-1;
}

body::before{
  width:180px;
  height:180px;
  background:rgba(255,159,201,.16);
  top:180px;
  left:-70px;
}

body::after{
  width:220px;
  height:220px;
  background:rgba(120,207,255,.13);
  right:-90px;
  bottom:80px;
}

.container{
  width:min(1200px,100%);
  margin:auto;
  padding:0 20px;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;

  height:72px;

  display:flex;
  align-items:center;

  background:rgba(255,255,255,.82);
  backdrop-filter:blur(18px);

  border-bottom:1px solid rgba(230,215,228,.8);
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:24px;
  font-weight:950;
  letter-spacing:1px;
  white-space:nowrap;
}

.logo span{
  color:var(--pink);
}

/* NAV */

.nav-links{
  display:flex;
  align-items:center;
  gap:22px;
}

.nav-links a{
  color:#606070;
  font-size:13px;
  font-weight:700;
  transition:.2s;
}

.nav-links a:hover{
  color:var(--pink);
}

/* SEARCH */

.search-area{
  display:flex;
  gap:8px;
}

.search-box{
  width:230px;
  height:42px;

  border:1px solid #eadfe9;
  border-radius:13px;

  background:white;

  padding:0 14px;
  outline:none;

  color:var(--text);
  font-size:13px;
}

.search-box:focus{
  border-color:var(--pink2);
  box-shadow:0 0 0 4px rgba(255,117,173,.08);
}

.search-btn{
  width:42px;
  height:42px;

  border:0;
  border-radius:13px;

  background:linear-gradient(135deg,var(--pink),#ff8fbc);

  color:white;
  cursor:pointer;
  font-size:17px;

  box-shadow:0 7px 18px rgba(255,117,173,.20);
}

/* HERO */

.hero{
  padding:65px 0 38px;
}

.hero-content{
  max-width:760px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:7px;

  padding:8px 13px;

  border-radius:999px;

  background:rgba(255,255,255,.8);
  border:1px solid #f0dfea;

  color:#e45b91;

  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;

  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(38px,6vw,68px);
  line-height:1.03;
  letter-spacing:-2px;
  margin-bottom:17px;
}

.hero h1 span{
  background:linear-gradient(
    90deg,
    #ff6fa8,
    #a98cff,
    #63c7f5
  );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  max-width:650px;

  color:var(--muted);
  font-size:14px;
  line-height:1.7;

  margin-bottom:25px;
}

.hero-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:12px 18px;

  border-radius:12px;

  font-size:13px;
  font-weight:800;
}

.primary-btn{
  background:linear-gradient(135deg,#ff70a9,#ff91be);
  color:white;

  box-shadow:0 10px 24px rgba(255,117,173,.20);
}

.secondary-btn{
  background:white;
  border:1px solid #eadfe9;
  color:#646575;
}

/* FILTERS */

.collection-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  margin-top:25px;
  margin-bottom:18px;
}

.collection-head h2{
  font-size:22px;
}

.count{
  color:#999aaa;
  font-size:12px;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.filter{
  border:1px solid #eadfe9;
  background:rgba(255,255,255,.75);

  color:#747585;

  padding:9px 14px;

  border-radius:999px;

  font-size:12px;
  font-weight:700;

  cursor:pointer;

  transition:.2s;
}

.filter:hover{
  border-color:#ffb4d2;
  color:#ed6099;
}

.filter.active{
  background:linear-gradient(135deg,#ff76ad,#ff9bc5);
  border-color:transparent;
  color:white;
  box-shadow:0 6px 16px rgba(255,117,173,.18);
}

/* SORT */

.sort-row{
  display:flex;
  justify-content:flex-end;
  margin-bottom:20px;
}

.sort{
  border:1px solid #eadfe9;
  background:white;

  border-radius:10px;

  padding:9px 12px;

  color:#666777;
  font-size:12px;
  outline:none;
}

/* CARDS */

.movies{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.movie-card{
  overflow:hidden;

  background:rgba(255,255,255,.9);

  border:1px solid #eee2eb;
  border-radius:15px;

  box-shadow:0 8px 25px rgba(100,70,100,.06);

  transition:
    transform .22s,
    box-shadow .22s;

  cursor:pointer;
}

.movie-card:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 32px rgba(100,70,100,.13);
}

.poster{
  position:relative;

  aspect-ratio:2/3;

  background:#f3edf3;

  overflow:hidden;
}

.poster img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  transition:.3s;
}

.movie-card:hover .poster img{
  transform:scale(1.04);
}

.year{
  position:absolute;
  top:9px;
  left:9px;

  padding:5px 7px;

  border-radius:7px;

  background:rgba(40,35,45,.75);
  backdrop-filter:blur(5px);

  color:white;

  font-size:10px;
  font-weight:800;
}

.country{
  position:absolute;
  right:9px;
  top:9px;

  padding:5px 7px;

  border-radius:7px;

  background:rgba(255,255,255,.88);

  color:#e25e96;

  font-size:9px;
  font-weight:900;
}

.card-info{
  padding:12px;
}

.card-info h3{
  font-size:13px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  margin-bottom:6px;
}

.card-meta{
  display:flex;
  justify-content:space-between;
  gap:5px;

  color:#9293a1;

  font-size:10px;
}

/* EMPTY */

.empty{
  grid-column:1/-1;

  text-align:center;

  padding:70px 20px;

  color:#888999;
}

.empty-icon{
  font-size:38px;
  margin-bottom:12px;
}

/* PAGINATION */

.pagination{
  display:flex;
  justify-content:center;
  gap:7px;

  margin:35px 0 65px;
}

.page-btn{
  min-width:38px;
  height:38px;

  padding:0 10px;

  border:1px solid #eadfe9;
  background:white;

  border-radius:10px;

  color:#6e6f80;

  font-size:12px;
  font-weight:800;

  cursor:pointer;
}

.page-btn.active{
  background:linear-gradient(135deg,#ff76ad,#ff9bc5);
  color:white;
  border-color:transparent;
}

.page-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* FOOTER */

footer{
  padding:25px 0;

  border-top:1px solid #eee3eb;

  text-align:center;

  color:#999aaa;
  font-size:11px;
}

/* TABLET */

@media(max-width:1050px){

  .movies{
    grid-template-columns:repeat(4,1fr);
  }

  .nav-links{
    display:none;
  }

}

/* MOBILE */

@media(max-width:700px){

  header{
    height:64px;
  }

  .logo{
    font-size:20px;
  }

  .search-area{
    flex:1;
    justify-content:flex-end;
  }

  .search-box{
    width:min(190px,100%);
  }

  .hero{
    padding:42px 0 25px;
  }

  .hero h1{
    letter-spacing:-1px;
  }

  .collection-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .movies{
    grid-template-columns:repeat(3,1fr);
    gap:9px;
  }

  .card-info{
    padding:9px;
  }

  .card-info h3{
    font-size:11px;
  }

  .card-meta{
    font-size:9px;
  }

}

/* SMALL MOBILE */

@media(max-width:450px){

  .container{
    padding:0 12px;
  }

  .search-btn{
    width:39px;
    height:39px;
  }

  .search-box{
    height:39px;
    width:150px;
  }

  .movies{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:38px;
  }

}
</style>
</head>

<body>

<header>

  <div class="container nav">

    <a href="index.html" class="logo">
      K-DRAMA <span>HUB</span>
    </a>

    <nav class="nav-links">
      <a href="#" onclick="setCategory('All')">Home</a>
      <a href="#" onclick="setCategory('K-Drama')">K-Drama</a>
      <a href="#" onclick="setCategory('C-Drama')">C-Drama</a>
      <a href="#" onclick="setCategory('All')">All Drama</a>
    </nav>

    <div class="search-area">

      <input
        id="searchInput"
        class="search-box"
        type="search"
        placeholder="Search dramas..."
      >

      <button
        class="search-btn"
        onclick="applySearch()"
      >
        🔍
      </button>

    </div>

  </div>

</header>


<main>

<section class="hero">

  <div class="container">

    <div class="hero-content">

      <div class="badge">
        💕 Your Drama World
      </div>

      <h1>
        Find your next
        <span>favorite drama.</span>
      </h1>

      <p>
        Explore beautiful K-Dramas, C-Dramas and all your
        favorite Asian dramas in one simple place.
      </p>

      <div class="hero-buttons">

        <a
          href="#collection"
          class="primary-btn"
        >
          ✨ Browse Dramas
        </a>

        <button
          class="secondary-btn"
          onclick="setCategory('Popular')"
        >
          ⭐ Popular Dramas
        </button>

      </div>

    </div>

  </div>

</section>


<section id="collection">

  <div class="container">

    <div class="collection-head">

      <div>
        <h2>Drama Collection</h2>
        <span class="count" id="count"></span>
      </div>

    </div>


    <div class="filters">

      <button
        class="filter active"
        data-category="All"
        onclick="setCategory('All')"
      >
        All
      </button>

      <button
        class="filter"
        data-category="K-Drama"
        onclick="setCategory('K-Drama')"
      >
        🇰🇷 K-Drama
      </button>

      <button
        class="filter"
        data-category="C-Drama"
        onclick="setCategory('C-Drama')"
      >
        🇨🇳 C-Drama
      </button>

      <button
        class="filter"
        data-category="Popular"
        onclick="setCategory('Popular')"
      >
        ⭐ Popular
      </button>

      <button
        class="filter"
        data-category="New"
        onclick="setCategory('New')"
      >
        🆕 New
      </button>

    </div>


    <div class="sort-row">

      <select id="sortSelect" class="sort">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="rating">Highest rated</option>
        <option value="title">A-Z</option>
      </select>

    </div>


    <div
      class="movies"
      id="movies"
    ></div>


    <div
      class="pagination"
      id="pagination"
    ></div>

  </div>

</section>

</main>


<footer>
  <div class="container">
    💕 K-DRAMA HUB — Your cozy drama world
  </div>
</footer>


<script>

let dramas = [];

let currentCategory = "All";
let currentSearch = "";
let currentPage = 1;

const itemsPerPage = 10;

const moviesContainer =
  document.getElementById("movies");

const pagination =
  document.getElementById("pagination");

const count =
  document.getElementById("count");

const searchInput =
  document.getElementById("searchInput");

const sortSelect =
  document.getElementById("sortSelect");


/* LOAD DATA */

async function loadDramas(){

  try{

    const response =
      await fetch("movies.json", {
        cache:"no-store"
      });

    if(!response.ok){
      throw new Error("movies.json not found");
    }

    dramas = await response.json();

    if(!Array.isArray(dramas)){
      throw new Error("Invalid movies.json");
    }

    render();

  }catch(error){

    console.error(error);

    moviesContainer.innerHTML = `
      <div class="empty">
        <div class="empty-icon">😔</div>
        <h3>Drama collection could not be loaded</h3>
        <p>Please check movies.json</p>
      </div>
    `;

  }

}


/* FILTER */

function getFiltered(){

  let result = [...dramas];


  if(currentCategory === "K-Drama"){

    result =
      result.filter(
        d => d.type === "K-Drama"
      );

  }


  if(currentCategory === "C-Drama"){

    result =
      result.filter(
        d => d.type === "C-Drama"
      );

  }


  if(currentCategory === "Popular"){

    result =
      result.filter(
        d => d.popular === true
      );

  }


  if(currentCategory === "New"){

    result =
      result.filter(
        d => d.isNew === true
      );

  }


  if(currentSearch){

    const search =
      currentSearch.toLowerCase();

    result =
      result.filter(d =>

        String(d.title || "")
          .toLowerCase()
          .includes(search)

        ||

        String(d.genre || "")
          .toLowerCase()
          .includes(search)

        ||

        String(d.type || "")
          .toLowerCase()
          .includes(search)

      );

  }


  const sort =
    sortSelect.value;


  if(sort === "newest"){

    result.sort(
      (a,b) =>
        new Date(b.addedAt) -
        new Date(a.addedAt)
    );

  }


  if(sort === "oldest"){

    result.sort(
      (a,b) =>
        new Date(a.addedAt) -
        new Date(b.addedAt)
    );

  }


  if(sort === "rating"){

    result.sort(
      (a,b) =>
        Number(b.rating || 0) -
        Number(a.rating || 0)
    );

  }


  if(sort === "title"){

    result.sort(
      (a,b) =>
        String(a.title)
          .localeCompare(String(b.title))
    );

  }


  return result;

}


/* RENDER */

function render(){

  const filtered =
    getFiltered();

  count.textContent =
    `${filtered.length} dramas`;

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        filtered.length / itemsPerPage
      )
    );


  if(currentPage > totalPages){
    currentPage = totalPages;
  }


  const start =
    (currentPage - 1) *
    itemsPerPage;

  const pageItems =
    filtered.slice(
      start,
      start + itemsPerPage
    );


  if(!pageItems.length){

    moviesContainer.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🌸</div>
        <h3>No dramas found</h3>
        <p>Try another search or category.</p>
      </div>
    `;

  }else{

    moviesContainer.innerHTML =
      pageItems.map(createCard).join("");

  }


  renderPagination(totalPages);

}


/* CARD */

function createCard(drama){

  const poster =
    drama.poster || "";

  return `

    <a
      class="movie-card"
      href="movie.html?id=${encodeURIComponent(drama.id)}"
    >

      <div class="poster">

        <img
          src="${escapeHtml(poster)}"
          alt="${escapeHtml(drama.title)}"
          loading="lazy"
          onerror="this.style.opacity='.2'"
        >

        <span class="year">
          ${escapeHtml(drama.year || "N/A")}
        </span>

        <span class="country">
          ${drama.type === "C-Drama" ? "🇨🇳 C-DRAMA" : "🇰🇷 K-DRAMA"}
        </span>

      </div>

      <div class="card-info">

        <h3>
          ${escapeHtml(drama.title || "Untitled")}
        </h3>

        <div class="card-meta">

          <span>
            ${escapeHtml(drama.genre || "Drama")}
          </span>

          <span>
            ⭐ ${escapeHtml(drama.rating || "N/A")}
          </span>

        </div>

      </div>

    </a>

  `;

}


/* PAGINATION */

function renderPagination(totalPages){

  pagination.innerHTML = "";

  const prev =
    document.createElement("button");

  prev.className = "page-btn";
  prev.textContent = "‹ Prev";
  prev.disabled = currentPage === 1;

  prev.onclick = () => {

    if(currentPage > 1){

      currentPage--;
      render();

      window.scrollTo({
        top:document.getElementById("collection").offsetTop - 80,
        behavior:"smooth"
      });

    }

  };

  pagination.appendChild(prev);


  for(
    let i = 1;
    i <= totalPages;
    i++
  ){

    const btn =
      document.createElement("button");

    btn.className =
      "page-btn" +
      (i === currentPage ? " active" : "");

    btn.textContent = i;

    btn.onclick = () => {

      currentPage = i;
      render();

      window.scrollTo({
        top:document.getElementById("collection").offsetTop - 80,
        behavior:"smooth"
      });

    };

    pagination.appendChild(btn);

  }


  const next =
    document.createElement("button");

  next.className = "page-btn";
  next.textContent = "Next ›";
  next.disabled =
    currentPage === totalPages;

  next.onclick = () => {

    if(currentPage < totalPages){

      currentPage++;
      render();

      window.scrollTo({
        top:document.getElementById("collection").offsetTop - 80,
        behavior:"smooth"
      });

    }

  };

  pagination.appendChild(next);

}


/* CATEGORY */

function setCategory(category){

  currentCategory = category;
  currentPage = 1;

  document
    .querySelectorAll(".filter")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.category === category
      );

    });

  render();

}


/* SEARCH */

function applySearch(){

  currentSearch =
    searchInput.value.trim();

  currentPage = 1;

  render();

}


searchInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){
      applySearch();
    }

  }
);


sortSelect.addEventListener(
  "change",
  () => {

    currentPage = 1;
    render();

  }
);


/* HTML SAFE */

function escapeHtml(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[c])
  );

}


loadDramas();

</script>

</body>
</html>
