<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07090d">
<title>NIGHTFLIX — Shorts</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}button,a{font:inherit}a{color:inherit;text-decoration:none}#app{height:100dvh;width:100%;position:relative;background:#050608}.topbar{position:absolute;z-index:20;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(#000b,transparent)}.brand{font-size:21px;font-weight:950;letter-spacing:1px}.brand span{color:#e50914}#feed{height:100%;width:100%;overflow:hidden;position:relative;touch-action:pan-y}.short{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#08090c;will-change:transform,opacity}.short.enter-down{animation:enterDown .34s cubic-bezier(.22,.75,.25,1) both}.short.enter-up{animation:enterUp .34s cubic-bezier(.22,.75,.25,1) both}@keyframes enterDown{from{transform:translateY(-12%);opacity:.65}to{transform:translateY(0);opacity:1}}@keyframes enterUp{from{transform:translateY(12%);opacity:.65}to{transform:translateY(0);opacity:1}}.short video,.poster-bg{position:absolute;width:100%;height:100%;object-fit:contain;background:#000}.poster-bg{object-fit:cover;filter:blur(24px) brightness(.28);transform:scale(1.12)}.short:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.88),transparent 35%,rgba(0,0,0,.12) 72%,rgba(0,0,0,.4))}.meta{position:absolute;z-index:3;left:22px;right:90px;bottom:max(35px,env(safe-area-inset-bottom));text-shadow:0 2px 12px #000}.tag{display:inline-block;background:#e50914;border-radius:4px;padding:5px 8px;font-size:10px;font-weight:900;letter-spacing:1px;margin-bottom:10px}.meta h2{font-size:clamp(22px,5vw,30px);margin:0 0 7px;font-weight:900}.meta p{font-size:13px;line-height:1.45;color:#ddd;margin:0;max-width:540px}.side{position:absolute;z-index:4;right:16px;bottom:105px;display:flex;flex-direction:column;gap:17px;align-items:center}.side button{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff50;background:#10131bbd;color:#fff;font-size:20px;display:grid;place-items:center;backdrop-filter:blur(8px)}.side small{font-size:10px;color:#eee;text-align:center}.detail-btn{width:auto!important;min-width:150px;height:48px!important;padding:0 15px!important;border-radius:28px!important;background:#e50914!important;border:0!important;font-size:12px!important;font-weight:900;letter-spacing:.3px!important;white-space:nowrap}.hint{position:absolute;z-index:5;top:75px;left:50%;transform:translateX(-50%);font-size:11px;color:#ffffffc9;background:#0008;padding:8px 12px;border-radius:20px;white-space:nowrap;pointer-events:none}.empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}.empty h2{font-size:25px;margin:0 0 10px}.empty p{color:#aab0bb;font-size:14px;line-height:1.6}.empty a{display:inline-block;margin-top:18px;background:#e50914;padding:12px 18px;border-radius:9px;font-weight:800}.progress{position:absolute;z-index:8;bottom:0;left:0;height:3px;background:#e50914;width:0;transition:width .15s linear}.sound-tip{position:absolute;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);background:#0009;border-radius:50%;width:66px;height:66px;display:grid;place-items:center;font-size:25px;opacity:0;pointer-events:none;transition:opacity .2s}.sound-tip.show{opacity:1}.play-tip{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:#0009;border:1px solid #ffffff70;font-size:30px;opacity:0;pointer-events:none;transition:opacity .18s}.play-tip.show{opacity:1}.audio-prompt{position:absolute;z-index:9;left:50%;top:42%;transform:translate(-50%,-50%);border:1px solid #ffffff55;background:#10131beF;color:white;border-radius:30px;padding:12px 17px;font-weight:800;box-shadow:0 8px 30px #0009}.audio-prompt[hidden]{display:none}@media(min-width:700px){.short{background:radial-gradient(ellipse at center,#171a22,#050608 70%)}.short video{height:100%;width:auto;max-width:100%;aspect-ratio:9/16;border-left:1px solid #222;border-right:1px solid #222}.short:after{left:0;right:0}.meta{left:max(calc((100vw - 520px)/2),24px);max-width:420px}.side{right:max(calc((100vw - 520px)/2),24px)}}
</style></head><body><div id="app"><header class="topbar"><a class="brand" href="index.html">NIGHT<span>FLIX</span></a></header><main id="feed" aria-label="Movie shorts feed"><div class="empty"><div><h2>Loading Shorts…</h2><p>Please wait</p></div></div></main><div class="progress" id="progress"></div></div>
<script>
'use strict';
const feed=document.getElementById('feed'),progress=document.getElementById('progress');
let shorts=[],movies=[],current=0,muted=true,startX=0,startY=0,startTime=0,progressFrame=null,audioNeedsGesture=false,transitionBusy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function movieFor(id){return movies.find(m=>String(m.id)===String(id));}
function movieUrl(item){return item&&item.movieId!==undefined&&item.movieId!==null?`movie.html?id=${encodeURIComponent(item.movieId)}`:"index.html";}
function render(direction="down"){
 if(!shorts.length){feed.innerHTML='<div class="empty"><div><h2>No Shorts Yet</h2><p>Add licensed short-video URLs in <b>shorts.json</b> to start the feed.<br>Swipe up/down for Shorts · Swipe right to open the linked movie.</p><a href="index.html">Back to NIGHTFLIX</a></div></div>';return;}
 const item=shorts[current],movie=movieFor(item.movieId)||{},poster=item.poster||movie.poster||'';
 feed.innerHTML=`<section class="short ${direction==='up'?'enter-up':'enter-down'}" id="activeShort">${poster?`<img class="poster-bg" src="${esc(poster)}" alt="">`:''}<video id="shortVideo" src="${esc(item.video)}" playsinline webkit-playsinline autoplay loop preload="auto" ${poster?`poster="${esc(poster)}"`:''}></video><div class="meta"><span class="tag">NIGHTFLIX SHORTS</span><h2>${esc(item.title||movie.title||'Movie Short')}</h2><p>${esc(item.caption||movie.description||'Discover this title on NIGHTFLIX.')}</p></div><div class="side"><div><button class="detail-btn" id="openMovie" aria-label="Watch full movie">WATCH FULL MOVIE ↗</button><small>${esc(movie.title||item.movieTitle||'Linked movie')}</small></div></div><div class="sound-tip" id="soundTip">${muted?'MUTED':'SOUND'}</div><div class="play-tip" id="playTip">PLAY</div><button class="audio-prompt" id="audioPrompt" ${audioNeedsGesture?'':'hidden'}>ENABLE SOUND</button></section>`;
 const video=document.getElementById('shortVideo');video.muted=muted;video.play().then(()=>{audioNeedsGesture=false;syncSoundUI();}).catch(()=>{muted=true;audioNeedsGesture=true;video.muted=true;video.play().catch(()=>{});const prompt=document.getElementById('audioPrompt');if(prompt)prompt.hidden=false;syncSoundUI();});
 video.addEventListener('click',()=>{if(suppressTap){suppressTap=false;return;}togglePlayback();});
 document.getElementById('audioPrompt').onclick=(e)=>{e.stopPropagation();enableSound();};
 document.getElementById('openMovie').onclick=(e)=>{e.stopPropagation();location.href=movieUrl(item);};
 
 
 video.addEventListener('timeupdate',()=>{if(video.duration)progress.style.width=(video.currentTime/video.duration*100)+'%'});
 video.addEventListener('ended',next);
 progress.style.width='0%';
}
function next(){if(!shorts.length||transitionBusy)return;transitionBusy=true;current=(current+1)%shorts.length;render('down');setTimeout(()=>transitionBusy=false,360);}
function previous(){if(!shorts.length||transitionBusy)return;transitionBusy=true;current=(current-1+shorts.length)%shorts.length;render('up');setTimeout(()=>transitionBusy=false,360);}
function syncSoundUI(){}
function showTip(el,text){if(!el)return;el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),550);}
function enableSound(){const v=document.getElementById('shortVideo');if(!v)return;muted=false;v.muted=false;v.volume=1;audioNeedsGesture=false;const prompt=document.getElementById('audioPrompt');if(prompt)prompt.hidden=true;v.play().catch(()=>{muted=true;v.muted=true;audioNeedsGesture=true;if(prompt)prompt.hidden=false;});syncSoundUI();showTip(document.getElementById('soundTip'),'SOUND ON');}
function toggleSound(){const v=document.getElementById('shortVideo');if(!v)return;if(muted){enableSound();return;}muted=true;v.muted=true;syncSoundUI();showTip(document.getElementById('soundTip'),'SOUND OFF');}
function togglePlayback(){const v=document.getElementById('shortVideo');if(!v)return;if(audioNeedsGesture||muted){enableSound();return;}if(v.paused){v.play().catch(()=>{});showTip(document.getElementById('playTip'),'PLAY');}else{v.pause();showTip(document.getElementById('playTip'),'PAUSE');}}
feed.addEventListener('touchstart',e=>{const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY;startTime=Date.now()},{passive:true});
feed.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<45)return;suppressTap=true;if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&shorts[current])location.href=movieUrl(shorts[current]);else if(dx<0)previous();}else{if(dy>0)next();else previous();}},{passive:true});
let suppressTap=false;feed.addEventListener('touchend',()=>{suppressTap=false;},{passive:true});
let wheelLock=false;feed.addEventListener('wheel',e=>{if(wheelLock||Math.abs(e.deltaY)<18)return;wheelLock=true;e.deltaY>0?next():previous();setTimeout(()=>wheelLock=false,420)},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown')next();if(e.key==='ArrowUp')previous();if(e.key===' '){e.preventDefault();togglePlayback();}if(e.key==='ArrowRight'&&shorts[current])location.href=movieUrl(shorts[current]);if(e.key==='ArrowLeft')previous();if(e.key==='Escape')location.href='index.html';});
(async()=>{try{const [s,m]=await Promise.all([fetch('shorts.json').then(r=>{if(!r.ok)throw Error('shorts.json missing');return r.json()}),fetch('movies.json').then(r=>{if(!r.ok)throw Error('movies.json missing');return r.json()})]);movies=Array.isArray(m)?m:[];shorts=Array.isArray(s)?s.filter(x=>x&&x.video&&x.movieId!==undefined&&movies.some(m=>String(m.id)===String(x.movieId))):[];if(!shorts.length){render();return;}
 // Shuffle once per page visit so every visit starts with a fresh random order.
 for(let i=shorts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shorts[i],shorts[j]]=[shorts[j],shorts[i]];}
 const requested=new URLSearchParams(location.search).get('i');if(requested!==null)current=Math.max(0,Math.min(shorts.length-1,Number(requested)||0));render();}catch(err){feed.innerHTML=`<div class="empty"><div><h2>Shorts could not load</h2><p>${esc(err.message)}<br>Keep shorts.json in the same folder as this page.</p><a href="index.html">Back to NIGHTFLIX</a></div></div>`;}})();
</script></body></html>
