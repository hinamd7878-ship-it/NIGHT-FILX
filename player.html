<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#000000"
>

<title>NIGHTFLIX Player</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;

  width:100%;
  height:100%;

  background:#000;

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  overflow:hidden;

}


body{

  display:flex;

  align-items:center;

  justify-content:center;

}


.player{

  position:relative;

  width:100vw;
  height:100vh;

  background:#000;

}


video{

  width:100%;
  height:100%;

  display:block;

  object-fit:contain;

  background:#000;

}


.overlay{

  position:absolute;

  inset:0;

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.72),
      transparent 20%,
      transparent 75%,
      rgba(0,0,0,.82)
    );

  opacity:1;

  transition:opacity .25s;

}


.overlay.hidden{

  opacity:0;

}


.top{

  padding:22px 28px;

  display:flex;

  align-items:center;

  gap:18px;

}


.title{

  font-size:
    clamp(
      18px,
      2.4vw,
      32px
    );

  font-weight:800;

  text-shadow:
    0 2px 8px #000;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


.badge{

  flex:0 0 auto;

  padding:6px 10px;

  border-radius:7px;

  background:#e50914;

  font-size:11px;

  font-weight:800;

}


.bottom{

  padding:
    18px
    28px
    25px;

  pointer-events:auto;

}


.progress{

  width:100%;

  height:7px;

  accent-color:#e50914;

  cursor:pointer;

}


.controls{

  display:flex;

  align-items:center;

  gap:12px;

  margin-top:13px;

}


button{

  border:
    1px solid
    rgba(255,255,255,.28);

  background:
    rgba(20,20,20,.78);

  color:#fff;

  border-radius:9px;

  min-width:48px;

  height:42px;

  padding:
    0 13px;

  font-size:15px;

  cursor:pointer;

}


button:focus{

  outline:
    3px solid #fff;

  outline-offset:2px;

}


.time{

  font-size:13px;

  color:#ddd;

  min-width:110px;

}


.hint{

  margin-left:auto;

  color:#aaa;

  font-size:11px;

}


.error{

  position:absolute;

  inset:0;

  display:none;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  gap:12px;

  background:#000;

  text-align:center;

  padding:30px;

}


.error.show{

  display:flex;

}


.error h1{

  margin:0;

  font-size:28px;

}


.error p{

  margin:0;

  color:#aaa;

  max-width:700px;

  line-height:1.5;

}


@media(max-width:700px){

  .top{

    padding:
      14px
      15px;

  }

  .bottom{

    padding:
      12px
      15px
      16px;

  }

  .hint{

    display:none;

  }

}

</style>

</head>


<body>


<div
  class="player"
  id="player"
>


  <video
    id="video"
    playsinline
    preload="metadata"
    tabindex="0"
  ></video>


  <div
    class="overlay"
    id="overlay"
  >


    <div class="top">

      <div class="badge">
        NIGHTFLIX
      </div>

      <div
        class="title"
        id="title"
      >
        Loading...
      </div>

    </div>


    <div class="bottom">


      <input
        id="progress"
        class="progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        aria-label="Video progress"
      >


      <div class="controls">


        <button
          id="backBtn"
          type="button"
        >
          ← Back
        </button>


        <button
          id="playBtn"
          type="button"
        >
          ▶ Play
        </button>


        <button
          id="minusBtn"
          type="button"
        >
          −10s
        </button>


        <button
          id="plusBtn"
          type="button"
        >
          +10s
        </button>


        <button
          id="muteBtn"
          type="button"
        >
          🔊
        </button>


        <button
          id="fullBtn"
          type="button"
        >
          ⛶
        </button>


        <span
          class="time"
          id="time"
        >
          00:00 / 00:00
        </span>


        <span class="hint">
          ←/→ seek • OK play • ↑/↓ volume • Back exit
        </span>


      </div>

    </div>

  </div>


  <div
    class="error"
    id="error"
  >

    <h1>
      Video could not be played
    </h1>

    <p id="errorText">
      This TV browser may not support this video
      format or the URL may not be a direct video file.
    </p>

    <button
      id="retryBtn"
      type="button"
    >
      Retry
    </button>

    <button
      id="errorBackBtn"
      type="button"
    >
      ← Back
    </button>

  </div>


</div>


<script>


const video =
  document.getElementById("video");


const title =
  document.getElementById("title");


const overlay =
  document.getElementById("overlay");


const progress =
  document.getElementById("progress");


const playBtn =
  document.getElementById("playBtn");


const muteBtn =
  document.getElementById("muteBtn");


const fullBtn =
  document.getElementById("fullBtn");


const time =
  document.getElementById("time");


const error =
  document.getElementById("error");


const errorText =
  document.getElementById("errorText");


const params =
  new URLSearchParams(
    location.search
  );


const videoUrl =
  params.get("video") || "";


const movieTitle =
  params.get("title") ||
  "NIGHTFLIX";


title.textContent =
  movieTitle;


document.title =
  movieTitle +
  " — NIGHTFLIX";


function formatTime(seconds){

  if(!Number.isFinite(seconds))
    return "00:00";


  seconds =
    Math.max(
      0,
      Math.floor(seconds)
    );


  const h =
    Math.floor(
      seconds / 3600
    );


  const m =
    Math.floor(
      (seconds % 3600) / 60
    );


  const s =
    seconds % 60;


  if(h){

    return (
      String(h).padStart(2,"0") +
      ":" +
      String(m).padStart(2,"0") +
      ":" +
      String(s).padStart(2,"0")
    );

  }


  return (
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0")
  );

}


function updatePlayButton(){

  playBtn.textContent =
    video.paused
      ? "▶ Play"
      : "❚❚ Pause";

}


function updateTime(){

  const duration =
    video.duration || 0;


  time.textContent =
    formatTime(
      video.currentTime
    ) +
    " / " +
    formatTime(
      duration
    );


  progress.value =
    duration
      ? (
          video.currentTime /
          duration
        ) * 100
      : 0;

}


function showError(message){

  errorText.textContent =
    message;

  error.classList.add(
    "show"
  );

}


async function togglePlay(){

  if(video.paused){

    try{

      await video.play();

    }catch(e){}

  }else{

    video.pause();

  }


  updatePlayButton();

}


function seekBy(seconds){

  if(
    Number.isFinite(
      video.duration
    )
  ){

    video.currentTime =
      Math.max(
        0,
        Math.min(
          video.duration,
          video.currentTime +
          seconds
        )
      );


    updateTime();

  }

}


function changeVolume(delta){

  video.muted =
    false;


  video.volume =
    Math.max(
      0,
      Math.min(
        1,
        video.volume +
        delta
      )
    );


  muteBtn.textContent =
    video.volume === 0
      ? "🔇"
      : "🔊";

}


async function toggleFullscreen(){

  try{

    if(
      document.fullscreenElement
    ){

      await document.exitFullscreen();

    }else if(
      document
        .getElementById("player")
        .requestFullscreen
    ){

      await document
        .getElementById("player")
        .requestFullscreen();

    }

  }catch(e){}

}


function goBack(){

  if(
    document.fullscreenElement
  ){

    document
      .exitFullscreen()
      .catch(()=>{});

    return;

  }


  if(
    history.length > 1
  ){

    history.back();

  }else{

    location.href =
      "index.html";

  }

}


if(!videoUrl){

  showError(
    "No video URL was supplied."
  );

}else{

  video.src =
    videoUrl;

  video.load();

}


video.addEventListener(
  "loadedmetadata",
  updateTime
);


video.addEventListener(
  "timeupdate",
  updateTime
);


video.addEventListener(
  "play",
  updatePlayButton
);


video.addEventListener(
  "pause",
  updatePlayButton
);


video.addEventListener(
  "volumechange",
  ()=>{

    muteBtn.textContent =
      video.muted ||
      video.volume === 0
        ? "🔇"
        : "🔊";

  }
);


video.addEventListener(
  "error",
  ()=>{

    showError(
      "The URL is not a playable direct video, " +
      "the format is unsupported, or the server " +
      "blocked the TV browser."
    );

  }
);


playBtn.onclick =
  togglePlay;


document
  .getElementById("minusBtn")
  .onclick =
    ()=>seekBy(-10);


document
  .getElementById("plusBtn")
  .onclick =
    ()=>seekBy(10);


document
  .getElementById("muteBtn")
  .onclick =
  ()=>{

    video.muted =
      !video.muted;

  };


document
  .getElementById("fullBtn")
  .onclick =
    toggleFullscreen;


document
  .getElementById("backBtn")
  .onclick =
    goBack;


document
  .getElementById("errorBackBtn")
  .onclick =
    goBack;


document
  .getElementById("retryBtn")
  .onclick =
  ()=>{

    error.classList.remove(
      "show"
    );

    video.load();

    video
      .play()
      .catch(()=>{});

  };


progress.addEventListener(
  "input",
  ()=>{

    if(
      Number.isFinite(
        video.duration
      )
    ){

      video.currentTime =
        (
          Number(
            progress.value
          ) / 100
        ) *
        video.duration;

    }

  }
);


let hideTimer;


function showOverlay(){

  overlay.classList.remove(
    "hidden"
  );


  clearTimeout(
    hideTimer
  );


  hideTimer =
    setTimeout(
      ()=>{

        if(!video.paused){

          overlay.classList.add(
            "hidden"
          );

        }

      },
      3500
    );

}


document
  .getElementById("player")
  .addEventListener(
    "mousemove",
    showOverlay
  );


document
  .getElementById("player")
  .addEventListener(
    "click",
    (e)=>{

      if(
        e.target === video
      ){

        togglePlay();

      }

      showOverlay();

    }
  );


/* =========================================
   TV REMOTE CONTROL
========================================= */


document.addEventListener(
  "keydown",
  (e)=>{

    const key =
      e.key;


    if(
      error.classList.contains(
        "show"
      )
    ){

      if(
        key === "Enter" ||
        key === " "
      ){

        e.preventDefault();

        document
          .getElementById(
            "retryBtn"
          )
          .click();

      }


      if(
        key === "Escape" ||
        key === "Backspace"
      ){

        e.preventDefault();

        goBack();

      }


      return;

    }


    if([

      "ArrowLeft",
      "ArrowRight",
      "ArrowUp",
      "ArrowDown",

      "Enter",
      " ",

      "Escape",
      "Backspace",

      "MediaPlayPause",
      "MediaPlay",
      "MediaPause"

    ].includes(key)){

      e.preventDefault();

    }


    switch(key){

      case "ArrowLeft":

        seekBy(-10);

        break;


      case "ArrowRight":

        seekBy(10);

        break;


      case "ArrowUp":

        changeVolume(
          0.1
        );

        break;


      case "ArrowDown":

        changeVolume(
          -0.1
        );

        break;


      case "Enter":

      case " ":

      case "MediaPlayPause":

        togglePlay();

        break;


      case "MediaPlay":

        video
          .play()
          .catch(()=>{});

        break;


      case "MediaPause":

        video.pause();

        break;


      case "Escape":

      case "Backspace":

        goBack();

        break;


      case "f":

      case "F":

        toggleFullscreen();

        break;

    }


    showOverlay();

  }
);


video.focus();

</script>

</body>
</html>
