<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>NIGHTFLIX Player</title>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: contain;
        }

        /* Loading */
        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            background: #000;
            color: #fff;
            z-index: 20;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #333;
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loading-text {
            font-size: 16px;
            color: #ddd;
        }

        /* Error */
        #error {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 30px;
            background: #000;
            color: #fff;
            z-index: 30;
        }

        #error h2 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        #error p {
            max-width: 700px;
            color: #aaa;
            line-height: 1.5;
        }

        #retry {
            margin-top: 15px;
            padding: 12px 25px;
            border: 0;
            border-radius: 6px;
            background: #ff6847;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        /* LIVE badge */
        #live-badge {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 10;

            display: none;

            padding: 7px 12px;
            border-radius: 5px;

            background: rgba(0, 0, 0, 0.75);
            color: #fff;

            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        #live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 6px;

            background: #ff0000;
            border-radius: 50%;
        }

        /* TV focus */
        button:focus {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            gap: 10px;

            padding: 10px;

            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;

            z-index: 15;
        }

        .control-btn {
            min-width: 55px;
            min-height: 45px;

            border: 0;
            border-radius: 7px;

            background: rgba(255, 255, 255, 0.15);
            color: #fff;

            font-size: 20px;
            cursor: pointer;
        }

        .control-btn:hover,
        .control-btn:focus {
            background: rgba(255, 255, 255, 0.3);
        }

        #status {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);

            display: none;

            padding: 8px 14px;

            background: rgba(0, 0, 0, 0.75);
            color: #fff;

            border-radius: 5px;
            font-size: 14px;

            z-index: 20;
        }
    </style>
</head>

<body>

<div id="player-container">

    <video
        id="video"
        playsinline
        webkit-playsinline
        preload="auto"
        controls
    ></video>

    <div id="live-badge">
        <span id="live-dot"></span>
        LIVE
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Loading stream...</div>
    </div>

    <div id="status"></div>

    <div id="error">
        <h2>Unable to play stream</h2>
        <p id="error-message">
            The video stream could not be loaded.
        </p>

        <button id="retry" tabindex="0">
            Retry
        </button>
    </div>

    <div id="controls">

        <button
            id="playBtn"
            class="control-btn"
            tabindex="0"
            aria-label="Play or Pause"
        >
            ▶
        </button>

        <button
            id="muteBtn"
            class="control-btn"
            tabindex="0"
            aria-label="Mute"
        >
            🔊
        </button>

        <button
            id="fullscreenBtn"
            class="control-btn"
            tabindex="0"
            aria-label="Fullscreen"
        >
            ⛶
        </button>

    </div>

</div>

<script>

    /*
     * ============================================================
     * NIGHTFLIX PLAYER
     * HLS.js + MP4 + Android TV Remote Support
     * ============================================================
     */

    const video = document.getElementById("video");
    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loading-text");

    const errorBox = document.getElementById("error");
    const errorMessage = document.getElementById("error-message");

    const retryButton = document.getElementById("retry");

    const liveBadge = document.getElementById("live-badge");

    const statusBox = document.getElementById("status");

    const playBtn = document.getElementById("playBtn");
    const muteBtn = document.getElementById("muteBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    let hls = null;
    let currentStreamUrl = "";

    /*
     * ------------------------------------------------------------
     * GET STREAM URL
     * ------------------------------------------------------------
     *
     * Supports:
     *
     * player.html?url=STREAM_URL
     * player.html?src=STREAM_URL
     * player.html?video=STREAM_URL
     * player.html?stream=STREAM_URL
     *
     */

    function getStreamUrl() {

        const params = new URLSearchParams(window.location.search);

        const url =
            params.get("url") ||
            params.get("src") ||
            params.get("video") ||
            params.get("stream");

        if (url) {
            return url;
        }

        /*
         * DD SPORTS STREAM
         *
         * If you want DD Sports as default stream,
         * this URL will be used when no URL parameter exists.
         */

        return "https://d3eyhgoylams0m.cloudfront.net/v1/manifest/93ce20f0f52760bf38be911ff4c91ed02aa2fd92/ed7bd2c7-8d10-4051-b397-2f6b90f99acb/979bc08a-2ad0-4ede-a303-846f6108a776/4.m3u8";
    }


    /*
     * ------------------------------------------------------------
     * UI HELPERS
     * ------------------------------------------------------------
     */

    function showLoading(message = "Loading stream...") {

        loadingText.textContent = message;

        loading.style.display = "flex";

        errorBox.style.display = "none";
    }


    function hideLoading() {

        loading.style.display = "none";
    }


    function showError(message) {

        hideLoading();

        errorMessage.textContent = message;

        errorBox.style.display = "flex";

        liveBadge.style.display = "none";
    }


    function hideError() {

        errorBox.style.display = "none";
    }


    function showStatus(message) {

        statusBox.textContent = message;

        statusBox.style.display = "block";

        clearTimeout(window.statusTimer);

        window.statusTimer = setTimeout(() => {

            statusBox.style.display = "none";

        }, 1500);
    }


    /*
     * ------------------------------------------------------------
     * CLEAN OLD HLS INSTANCE
     * ------------------------------------------------------------
     */

    function destroyHls() {

        if (hls) {

            try {
                hls.destroy();
            } catch (e) {
                console.log(e);
            }

            hls = null;
        }
    }


    /*
     * ------------------------------------------------------------
     * LOAD STREAM
     * ------------------------------------------------------------
     */

    function loadStream() {

        destroyHls();

        hideError();

        showLoading("Connecting to live stream...");

        liveBadge.style.display = "none";

        currentStreamUrl = getStreamUrl();

        if (!currentStreamUrl) {

            showError("No stream URL was provided.");

            return;
        }

        console.log("Stream URL:", currentStreamUrl);


        /*
         * ========================================================
         * HLS STREAM
         * ========================================================
         */

        const isHls =
            currentStreamUrl.toLowerCase().includes(".m3u8");


        if (isHls) {

            /*
             * HLS.js supported browser
             */

            if (window.Hls && Hls.isSupported()) {

                console.log("Using HLS.js");

                hls = new Hls({

                    enableWorker: true,

                    lowLatencyMode: true,

                    backBufferLength: 30,

                    maxBufferLength: 30,

                    maxMaxBufferLength: 60

                });


                hls.loadSource(currentStreamUrl);

                hls.attachMedia(video);


                /*
                 * Manifest loaded
                 */

                hls.on(
                    Hls.Events.MANIFEST_PARSED,
                    function () {

                        console.log(
                            "HLS manifest loaded successfully"
                        );

                        hideLoading();

                        liveBadge.style.display = "block";

                        playVideo();

                    }
                );


                /*
                 * HLS error handling
                 */

                hls.on(
                    Hls.Events.ERROR,
                    function (event, data) {

                        console.log(
                            "HLS ERROR:",
                            data
                        );


                        if (!data.fatal) {
                            return;
                        }


                        switch (data.type) {


                            case Hls.ErrorTypes.NETWORK_ERROR:

                                console.log(
                                    "HLS network error. Retrying..."
                                );

                                showStatus(
                                    "Network error - reconnecting..."
                                );

                                setTimeout(() => {

                                    if (hls) {
                                        hls.startLoad();
                                    }

                                }, 1000);

                                break;


                            case Hls.ErrorTypes.MEDIA_ERROR:

                                console.log(
                                    "HLS media error. Recovering..."
                                );

                                showStatus(
                                    "Recovering video..."
                                );

                                if (hls) {
                                    hls.recoverMediaError();
                                }

                                break;


                            default:

                                console.log(
                                    "Fatal HLS error"
                                );

                                destroyHls();

                                showError(
                                    "This live stream cannot be played in this browser. The stream may have expired or may require access permissions."
                                );

                                break;

                        }

                    }
                );


                return;
            }


            /*
             * ====================================================
             * NATIVE HLS
             * ====================================================
             *
             * Safari / some TV browsers
             */

            if (
                video.canPlayType(
                    "application/vnd.apple.mpegurl"
                )
            ) {

                console.log(
                    "Using native HLS support"
                );

                video.src = currentStreamUrl;

                video.addEventListener(
                    "loadedmetadata",
                    function () {

                        hideLoading();

                        liveBadge.style.display = "block";

                        playVideo();

                    },
                    { once: true }
                );


                video.addEventListener(
                    "error",
                    function () {

                        showError(
                            "The HLS stream could not be loaded."
                        );

                    },
                    { once: true }
                );


                return;
            }


            /*
             * HLS not supported
             */

            showError(
                "This device/browser does not support HLS playback."
            );

            return;
        }


        /*
         * ========================================================
         * NORMAL MP4 / DIRECT VIDEO
         * ========================================================
         */

        console.log(
            "Using normal HTML5 video"
        );

        video.src = currentStreamUrl;

        video.load();


        video.addEventListener(
            "loadedmetadata",
            function () {

                hideLoading();

                playVideo();

            },
            { once: true }
        );


        video.addEventListener(
            "error",
            function () {

                showError(
                    "The video file could not be played."
                );

            },
            { once: true }
        );
    }


    /*
     * ------------------------------------------------------------
     * PLAY VIDEO
     * ------------------------------------------------------------
     */

    function playVideo() {

        const promise = video.play();

        if (promise !== undefined) {

            promise
                .then(() => {

                    hideLoading();

                    updatePlayButton();

                })
                .catch((error) => {

                    console.log(
                        "Autoplay blocked:",
                        error
                    );

                    hideLoading();

                    updatePlayButton();

                    showStatus(
                        "Press OK / Enter to play"
                    );

                });
        }
    }


    /*
     * ------------------------------------------------------------
     * PLAY / PAUSE
     * ------------------------------------------------------------
     */

    function togglePlay() {

        if (video.paused) {

            video.play()
                .then(() => {
                    updatePlayButton();
                })
                .catch(() => {
                    showStatus("Unable to play");
                });

        } else {

            video.pause();

            updatePlayButton();
        }
    }


    function updatePlayButton() {

        if (video.paused) {

            playBtn.textContent = "▶";

        } else {

            playBtn.textContent = "⏸";

        }
    }


    /*
     * ------------------------------------------------------------
     * MUTE
     * ------------------------------------------------------------
     */

    function toggleMute() {

        video.muted = !video.muted;

        updateMuteButton();

    }


    function updateMuteButton() {

        if (video.muted || video.volume === 0) {

            muteBtn.textContent = "🔇";

        } else {

            muteBtn.textContent = "🔊";

        }
    }


    /*
     * ------------------------------------------------------------
     * VOLUME
     * ------------------------------------------------------------
     */

    function volumeUp() {

        video.muted = false;

        video.volume = Math.min(
            1,
            video.volume + 0.1
        );

        updateMuteButton();

        showStatus(
            "Volume " +
            Math.round(video.volume * 100) +
            "%"
        );
    }


    function volumeDown() {

        video.muted = false;

        video.volume = Math.max(
            0,
            video.volume - 0.1
        );

        updateMuteButton();

        showStatus(
            "Volume " +
            Math.round(video.volume * 100) +
            "%"
        );
    }


    /*
     * ------------------------------------------------------------
     * FULLSCREEN
     * ------------------------------------------------------------
     */

    function toggleFullscreen() {

        const container =
            document.getElementById(
                "player-container"
            );


        if (
            document.fullscreenElement ||
            document.webkitFullscreenElement
        ) {

            if (document.exitFullscreen) {

                document.exitFullscreen();

            } else if (
                document.webkitExitFullscreen
            ) {

                document.webkitExitFullscreen();

            }

            return;
        }


        if (container.requestFullscreen) {

            container.requestFullscreen();

        } else if (
            container.webkitRequestFullscreen
        ) {

            container.webkitRequestFullscreen();

        } else if (video.webkitEnterFullscreen) {

            video.webkitEnterFullscreen();

        }

    }


    /*
     * ------------------------------------------------------------
     * TV REMOTE SUPPORT
     * ------------------------------------------------------------
     *
     * ENTER / OK
     *       Play / Pause
     *
     * SPACE
     *       Play / Pause
     *
     * MEDIA PLAY PAUSE
     *       Play / Pause
     *
     * UP
     *       Volume +
     *
     * DOWN
     *       Volume -
     *
     * LEFT / RIGHT
     *       Seek for normal video
     *
     * BACK / ESCAPE
     *       Go back
     *
     * F
     *       Fullscreen
     *
     */

    document.addEventListener(
        "keydown",
        function (e) {

            console.log(
                "Remote key:",
                e.key,
                e.keyCode
            );


            /*
             * OK / ENTER
             */

            if (
                e.key === "Enter" ||
                e.key === "NumpadEnter"
            ) {

                e.preventDefault();

                togglePlay();

                return;
            }


            /*
             * SPACE
             */

            if (e.key === " ") {

                e.preventDefault();

                togglePlay();

                return;
            }


            /*
             * MEDIA PLAY / PAUSE
             */

            if (
                e.key === "MediaPlayPause" ||
                e.keyCode === 179
            ) {

                e.preventDefault();

                togglePlay();

                return;
            }


            /*
             * VOLUME UP
             */

            if (
                e.key === "ArrowUp"
            ) {

                e.preventDefault();

                volumeUp();

                return;
            }


            /*
             * VOLUME DOWN
             */

            if (
                e.key === "ArrowDown"
            ) {

                e.preventDefault();

                volumeDown();

                return;
            }


            /*
             * LEFT
             *
             * Only seek when duration is finite.
             *
             * Live streams normally have Infinity duration,
             * therefore live TV will not accidentally seek.
             */

            if (
                e.key === "ArrowLeft"
            ) {

                e.preventDefault();

                if (
                    Number.isFinite(video.duration)
                ) {

                    video.currentTime =
                        Math.max(
                            0,
                            video.currentTime - 10
                        );

                    showStatus("-10 seconds");

                }

                return;
            }


            /*
             * RIGHT
             */

            if (
                e.key === "ArrowRight"
            ) {

                e.preventDefault();

                if (
                    Number.isFinite(video.duration)
                ) {

                    video.currentTime =
                        Math.min(
                            video.duration,
                            video.currentTime + 10
                        );

                    showStatus("+10 seconds");

                }

                return;
            }


            /*
             * FULLSCREEN
             */

            if (
                e.key === "f" ||
                e.key === "F"
            ) {

                e.preventDefault();

                toggleFullscreen();

                return;
            }


            /*
             * BACK BUTTON
             *
             * Android TV WebView may send:
             *
             * Escape
             * Backspace
             * BrowserBack
             */

            if (
                e.key === "Escape" ||
                e.key === "Backspace" ||
                e.key === "BrowserBack" ||
                e.keyCode === 4
            ) {

                e.preventDefault();

                if (
                    document.fullscreenElement ||
                    document.webkitFullscreenElement
                ) {

                    toggleFullscreen();

                } else {

                    window.history.back();

                }

                return;
            }

        }
    );


    /*
     * ------------------------------------------------------------
     * BUTTON EVENTS
     * ------------------------------------------------------------
     */

    playBtn.addEventListener(
        "click",
        function () {

            togglePlay();

        }
    );


    muteBtn.addEventListener(
        "click",
        function () {

            toggleMute();

        }
    );


    fullscreenBtn.addEventListener(
        "click",
        function () {

            toggleFullscreen();

        }
    );


    retryButton.addEventListener(
        "click",
        function () {

            loadStream();

        }
    );


    /*
     * ------------------------------------------------------------
     * VIDEO EVENTS
     * ------------------------------------------------------------
     */

    video.addEventListener(
        "play",
        function () {

            updatePlayButton();

            hideLoading();

        }
    );


    video.addEventListener(
        "pause",
        function () {

            updatePlayButton();

        }
    );


    video.addEventListener(
        "waiting",
        function () {

            showStatus(
                "Buffering..."
            );

        }
    );


    video.addEventListener(
        "playing",
        function () {

            hideLoading();

            statusBox.style.display =
                "none";

        }
    );


    video.addEventListener(
        "volumechange",
        function () {

            updateMuteButton();

        }
    );


    /*
     * ------------------------------------------------------------
     * PREVENT RIGHT CLICK
     * ------------------------------------------------------------
     */

    document.addEventListener(
        "contextmenu",
        function (e) {

            e.preventDefault();

        }
    );


    /*
     * ------------------------------------------------------------
     * INITIALIZE
     * ------------------------------------------------------------
     */

    video.volume = 1;

    updatePlayButton();

    updateMuteButton();

    loadStream();

</script>

</body>
</html>
