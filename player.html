<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NIGHTFLIX — Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#player-container{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}
video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;background:#000;color:#fff;z-index:20}
.spinner{width:45px;height:45px;border:4px solid #333;border-top:4px solid #fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{font-size:16px;color:#ddd;text-align:center;padding:0 20px}
#error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px;background:#000;color:#fff;z-index:30}
#error h2{margin:0 0 12px;font-size:24px}
#error-message{max-width:850px;color:#aaa;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#retry{margin-top:15px;padding:12px 25px;border:0;border-radius:6px;background:#ff6847;color:#fff;font-size:16px;cursor:pointer}
#live-badge{position:absolute;top:18px;left:18px;z-index:10;display:none;padding:7px 12px;border-radius:5px;background:rgba(0,0,0,.75);color:#fff;font-size:13px;font-weight:bold;letter-spacing:.5px}
#live-dot{display:inline-block;width:8px;height:8px;margin-right:6px;background:red;border-radius:50%}
#status{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);display:none;padding:8px 14px;background:rgba(0,0,0,.78);color:#fff;border-radius:5px;font-size:14px;z-index:25;text-align:center}
#controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:10px;background:rgba(0,0,0,.7);border-radius:10px;z-index:15}
.control-btn{min-width:55px;min-height:45px;border:0;border-radius:7px;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer}
.control-btn:hover,.control-btn:focus{background:rgba(255,255,255,.3)}
button:focus{outline:3px solid #fff;outline-offset:3px}
#debug{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);padding:6px 9px;background:rgba(0,0,0,.7);color:#777;font-size:10px;z-index:5;display:none;word-break:break-all}
</style>
</head>
<body>
<div id="player-container">
<video id="video" playsinline webkit-playsinline preload="auto" controls crossorigin="anonymous"></video>
<div id="live-badge"><span id="live-dot"></span>LIVE</div>
<div id="loading"><div class="spinner"></div><div id="loading-text">Loading stream...</div></div>
<div id="status"></div>
<div id="error"><h2>Unable to play stream</h2><p id="error-message">The video stream could not be loaded.</p><button id="retry">Retry</button></div>
<div id="controls">
<button id="playBtn" class="control-btn" aria-label="Play or Pause">▶</button>
<button id="muteBtn" class="control-btn" aria-label="Mute">🔊</button>
<button id="fullscreenBtn" class="control-btn" aria-label="Fullscreen">⛶</button>
</div>
<div id="debug"></div>
</div>

<script>
"use strict";

const video=document.getElementById("video");
const loading=document.getElementById("loading");
const loadingText=document.getElementById("loading-text");
const errorBox=document.getElementById("error");
const errorMessage=document.getElementById("error-message");
const retryButton=document.getElementById("retry");
const liveBadge=document.getElementById("live-badge");
const statusBox=document.getElementById("status");
const playBtn=document.getElementById("playBtn");
const muteBtn=document.getElementById("muteBtn");
const fullscreenBtn=document.getElementById("fullscreenBtn");
const debugBox=document.getElementById("debug");

let hls=null,currentStreamUrl="",reconnectTimer=null,reconnectAttempts=0;
let hlsRecoveryAttempts=0,isLoadingStream=false,lastHlsError="",streamType="";

function getStreamUrl(){
    const params=new URLSearchParams(window.location.search);
    let url=params.get("url")||params.get("src")||params.get("video")||params.get("stream");

    if(!url){
        url="https://d3eyhgoylams0m.cloudfront.net/v1/manifest/93ce20f0f52760bf38be911ff4c91ed02aa2fd92/ed7bd2c7-8d10-4051-b397-2f6b90f99acb/979bc08a-2ad0-4ede-a303-846f6108a776/4.m3u8";
    }

    try{
        if(/%3A|%2F|%3F|%26|%3D/i.test(url)) url=decodeURIComponent(url);
    }catch(e){console.log("URL decode skipped:",e)}

    return url.trim();
}

function isHlsUrl(url){
    if(!url)return false;
    const lower=url.toLowerCase().split("#")[0];

    if(lower.includes(".m3u8"))return true;

    if(
        lower.includes("format=m3u8")||
        lower.includes("type=m3u8")||
        lower.includes("playlist=m3u8")||
        lower.includes("manifest=m3u8")||
        lower.includes("hls=true")||
        lower.includes("hls=1")
    )return true;

    if(lower.includes("/manifest/")&&!/\.(mp4|webm|mkv|mov)(\?|$)/i.test(lower))return true;

    return false;
}

function showLoading(message){
    loadingText.textContent=message||"Loading stream...";
    loading.style.display="flex";
    errorBox.style.display="none";
}
function hideLoading(){loading.style.display="none"}
function showError(message){
    hideLoading();
    errorMessage.textContent=message||"The video stream could not be played.";
    errorBox.style.display="flex";
    liveBadge.style.display="none";
}
function hideError(){errorBox.style.display="none"}
function showStatus(message){
    statusBox.textContent=message||"";
    statusBox.style.display="block";
    clearTimeout(window.nightflixStatusTimer);
    window.nightflixStatusTimer=setTimeout(()=>statusBox.style.display="none",2200);
}
function setDebug(message){debugBox.textContent=message||""}

function getVideoErrorMessage(){
    if(!video.error)return"Unknown HTML5 video error.";
    switch(video.error.code){
        case MediaError.MEDIA_ERR_ABORTED:return"Playback was aborted.";
        case MediaError.MEDIA_ERR_NETWORK:return"Network error while loading the video.";
        case MediaError.MEDIA_ERR_DECODE:return"The browser could not decode this video/stream.";
        case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED:return"The video format or stream is not supported.";
        default:return"Unknown video error (code "+video.error.code+").";
    }
}

function getHlsErrorMessage(data){
    if(!data)return"Unknown HLS error.";
    let message="HLS "+(data.type||"UNKNOWN")+"\n"+(data.details||"UNKNOWN_DETAIL");

    if(data.response){
        if(data.response.code)message+="\nHTTP status: "+data.response.code;
        if(data.response.url)message+="\nRequest: "+data.response.url;
    }
    if(data.networkDetails&&typeof data.networkDetails.status==="number"){
        message+="\nNetwork status: "+data.networkDetails.status;
    }
    if(data.error&&data.error.message)message+="\nError: "+data.error.message;
    if(data.reason)message+="\nReason: "+data.reason;
    if(data.url)message+="\nURL: "+data.url;

    return message;
}

function destroyHls(){
    if(hls){
        try{hls.destroy()}catch(e){console.log("HLS destroy error:",e)}
        hls=null;
    }
}

function resetVideo(){
    try{video.pause()}catch(e){}
    try{video.removeAttribute("src");video.load()}catch(e){}
}

function loadStream(){
    if(isLoadingStream)return;

    isLoadingStream=true;
    clearTimeout(reconnectTimer);
    destroyHls();
    resetVideo();
    hideError();
    liveBadge.style.display="none";
    showLoading("Connecting to stream...");

    currentStreamUrl=getStreamUrl();

    if(!currentStreamUrl){
        isLoadingStream=false;
        showError("No stream URL was provided.");
        return;
    }

    console.log("NIGHTFLIX STREAM:",currentStreamUrl);
    setDebug(currentStreamUrl);

    if(isHlsUrl(currentStreamUrl)){
        streamType="HLS";
        loadHls();
    }else{
        streamType="VIDEO";
        loadNormalVideo();
    }
}

function loadHls(){
    showLoading("Loading HLS stream...");
    hlsRecoveryAttempts=0;

    if(window.Hls&&Hls.isSupported()){
        hls=new Hls({
            enableWorker:false,
            lowLatencyMode:false,
            backBufferLength:30,
            maxBufferLength:30,
            maxMaxBufferLength:60,
            maxBufferSize:60*1000*1000,
            liveSyncDurationCount:3,
            liveMaxLatencyDurationCount:8,
            manifestLoadingMaxRetry:2,
            levelLoadingMaxRetry:2,
            fragLoadingMaxRetry:3,
            manifestLoadingRetryDelay:1000,
            levelLoadingRetryDelay:1000,
            fragLoadingRetryDelay:1000,
            startFragPrefetch:true,
            capLevelToPlayerSize:true
        });

        hls.on(Hls.Events.MEDIA_ATTACHED,function(){
            try{hls.loadSource(currentStreamUrl)}
            catch(e){
                isLoadingStream=false;
                showError("Could not load HLS source.\n\n"+e.message);
            }
        });

        hls.on(Hls.Events.MANIFEST_PARSED,function(event,data){
            console.log("HLS manifest parsed:",data);
            isLoadingStream=false;
            reconnectAttempts=0;
            hlsRecoveryAttempts=0;
            lastHlsError="";
            hideLoading();
            hideError();
            liveBadge.style.display="block";
            showStatus("Stream connected");
            playVideo();
        });

        hls.on(Hls.Events.FRAG_LOADED,function(){
            if(video.readyState>=2)hideLoading();
        });

        hls.on(Hls.Events.LEVEL_LOADED,function(){
            if(video.readyState>=2)hideLoading();
        });

        hls.on(Hls.Events.ERROR,function(event,data){
            console.log("HLS ERROR:",data);
            lastHlsError=getHlsErrorMessage(data);
            setDebug(lastHlsError);

            if(!data.fatal){
                if(data.details===Hls.ErrorDetails.BUFFER_STALLED_ERROR)showStatus("Buffering...");
                return;
            }

            if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
                if(hlsRecoveryAttempts<2&&hls){
                    hlsRecoveryAttempts++;
                    showStatus("Recovering stream...");
                    try{hls.startLoad();return}
                    catch(e){console.log("HLS startLoad failed:",e)}
                }
                scheduleReconnect("Network error");
                return;
            }

            if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
                if(hlsRecoveryAttempts<2&&hls){
                    hlsRecoveryAttempts++;
                    showStatus("Recovering video...");
                    try{hls.recoverMediaError();return}
                    catch(e){console.log("Media recovery failed:",e)}
                }
                scheduleReconnect("Media error");
                return;
            }

            isLoadingStream=false;
            showError(
                "HLS stream failed.\n\n"+lastHlsError+
                "\n\nPossible causes:\n"+
                "• CORS restriction\n• HTTP 403/404\n• Expired stream URL\n"+
                "• Server blocked browser request\n• Invalid HLS manifest"
            );
        });

        hls.attachMedia(video);
        return;
    }

    if(
        video.canPlayType("application/vnd.apple.mpegurl")||
        video.canPlayType("application/x-mpegURL")
    ){
        video.src=currentStreamUrl;
        video.load();
        isLoadingStream=false;
        return;
    }

    isLoadingStream=false;
    showError("HLS playback is not supported by this browser.");
}

function loadNormalVideo(){
    showLoading("Loading video...");
    video.src=currentStreamUrl;
    video.load();
    isLoadingStream=false;
}

function scheduleReconnect(reason){
    clearTimeout(reconnectTimer);
    reconnectAttempts++;

    if(reconnectAttempts>5){
        isLoadingStream=false;
        showError(
            "Unable to reconnect.\n\n"+(reason||"Stream error")+
            "\n\n"+(lastHlsError||"")+
            "\n\nIf the URL works directly but not here, the server may be blocking browser/CORS requests."
        );
        return;
    }

    showLoading("Reconnecting... ("+reconnectAttempts+"/5)");
    reconnectTimer=setTimeout(function(){
        isLoadingStream=false;
        loadStream();
    },2000);
}

function playVideo(){
    video.muted=false;
    const promise=video.play();

    if(promise&&typeof promise.then==="function"){
        promise.then(function(){
            hideLoading();
            updatePlayButton();
        }).catch(function(error){
            console.log("Autoplay blocked:",error);
            video.muted=true;

            video.play().then(function(){
                hideLoading();
                updatePlayButton();
                updateMuteButton();
                showStatus("Press OK to enable sound");
            }).catch(function(){
                hideLoading();
                updatePlayButton();
                showStatus("Press OK / Play to start");
            });
        });
    }
}

function togglePlay(){
    if(video.paused){
        const p=video.play();
        if(p)p.then(updatePlayButton).catch(()=>showStatus("Press OK again to play"));
    }else{
        video.pause();
        updatePlayButton();
    }
}
function updatePlayButton(){playBtn.textContent=video.paused?"▶":"⏸"}
function toggleMute(){video.muted=!video.muted;updateMuteButton()}
function updateMuteButton(){muteBtn.textContent=(video.muted||video.volume===0)?"🔇":"🔊"}

function volumeUp(){
    video.muted=false;
    video.volume=Math.min(1,video.volume+0.1);
    updateMuteButton();
    showStatus("Volume "+Math.round(video.volume*100)+"%");
}
function volumeDown(){
    video.muted=false;
    video.volume=Math.max(0,video.volume-0.1);
    updateMuteButton();
    showStatus("Volume "+Math.round(video.volume*100)+"%");
}

function toggleFullscreen(){
    const container=document.getElementById("player-container");

    if(document.fullscreenElement||document.webkitFullscreenElement){
        if(document.exitFullscreen)document.exitFullscreen();
        else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
        return;
    }

    if(container.requestFullscreen)container.requestFullscreen();
    else if(container.webkitRequestFullscreen)container.webkitRequestFullscreen();
    else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();
}

document.addEventListener("keydown",function(e){
    const key=String(e.key||"");
    const lower=key.toLowerCase();

    if(key==="Enter"||key==="NumpadEnter"||e.keyCode===13){
        e.preventDefault();

        if(video.muted){
            video.muted=false;
            updateMuteButton();
            if(video.paused)togglePlay();
            showStatus("Sound ON");
            return;
        }
        togglePlay();
        return;
    }

    if(key===" "){e.preventDefault();togglePlay();return}
    if(key==="MediaPlayPause"||e.keyCode===179){e.preventDefault();togglePlay();return}
    if(key==="ArrowUp"){e.preventDefault();volumeUp();return}
    if(key==="ArrowDown"){e.preventDefault();volumeDown();return}

    if(key==="ArrowLeft"||key==="ArrowRight"){
        if(Number.isFinite(video.duration)){
            e.preventDefault();
            const amount=key==="ArrowLeft"?-10:10;
            video.currentTime=Math.max(0,Math.min(video.duration,video.currentTime+amount));
            showStatus(amount<0?"-10 seconds":"+10 seconds");
        }
        return;
    }

    if(lower==="f"){e.preventDefault();toggleFullscreen();return}

    if(key==="Escape"||key==="Backspace"||key==="BrowserBack"||e.keyCode===4){
        e.preventDefault();

        if(document.fullscreenElement||document.webkitFullscreenElement)toggleFullscreen();
        else window.history.back();
    }
});

playBtn.addEventListener("click",togglePlay);
muteBtn.addEventListener("click",toggleMute);
fullscreenBtn.addEventListener("click",toggleFullscreen);

retryButton.addEventListener("click",function(){
    reconnectAttempts=0;
    hlsRecoveryAttempts=0;
    isLoadingStream=false;
    lastHlsError="";
    loadStream();
});

video.addEventListener("play",function(){updatePlayButton();hideLoading()});
video.addEventListener("pause",updatePlayButton);
video.addEventListener("waiting",function(){showStatus("Buffering...")});
video.addEventListener("playing",function(){
    hideLoading();
    statusBox.style.display="none";
    liveBadge.style.display="block";
});
video.addEventListener("canplay",hideLoading);
video.addEventListener("loadedmetadata",function(){
    hideLoading();
    liveBadge.style.display="block";
});
video.addEventListener("stalled",function(){showStatus("Stream buffering...")});

video.addEventListener("error",function(){
    console.log("HTML5 VIDEO ERROR:",video.error);

    if(!hls){
        const message=getVideoErrorMessage();
        setDebug(message);
        showError(
            message+
            "\n\nPossible causes:\n"+
            "• Unsupported format\n• CORS restriction\n• HTTP 403/404\n"+
            "• Expired URL\n• Server blocked browser request"
        );
    }
});

video.addEventListener("volumechange",updateMuteButton);
document.addEventListener("contextmenu",e=>e.preventDefault());

video.volume=1;
video.muted=false;
updatePlayButton();
updateMuteButton();
loadStream();
</script>

<script>
(function(){
    "use strict";

    document.addEventListener("dragstart",function(e){e.preventDefault()},{capture:true});

    document.addEventListener("keydown",function(e){
        const key=String(e.key||"").toLowerCase();
        const code=String(e.code||"").toLowerCase();

        if(
            e.key==="F12"||code==="f12"||
            (e.ctrlKey&&e.shiftKey&&(key==="i"||key==="j"||key==="c"))||
            (e.ctrlKey&&key==="u")||
            (e.ctrlKey&&key==="s")
        ){
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    },{capture:true});

    const style=document.createElement("style");
    style.textContent=`
        body,body *{
            -webkit-user-select:none!important;
            user-select:none!important;
            -webkit-touch-callout:none!important;
        }
        input,textarea,select,[contenteditable="true"]{
            -webkit-user-select:text!important;
            user-select:text!important;
        }
        img,video{
            -webkit-user-drag:none!important;
            user-drag:none!important;
        }
    `;
    document.head.appendChild(style);
})();
</script>
</body>
</html>
