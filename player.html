<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NIGHTFLIX — Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#player-container{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}
video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;background:#000;color:#fff;z-index:20}
.spinner{width:45px;height:45px;border:4px solid #333;border-top:4px solid #fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{font-size:16px;color:#ddd;text-align:center;padding:0 20px}
#error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px;background:#000;color:#fff;z-index:30}
#error h2{margin:0 0 12px;font-size:24px}
#error-message{max-width:850px;color:#aaa;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#retry{margin-top:15px;padding:12px 25px;border:0;border-radius:6px;background:#ff6847;color:#fff;font-size:16px;cursor:pointer}
#live-badge{position:absolute;top:18px;left:18px;z-index:10;display:none;padding:7px 12px;border-radius:5px;background:rgba(0,0,0,.75);color:#fff;font-size:13px;font-weight:bold;letter-spacing:.5px}
#live-dot{display:inline-block;width:8px;height:8px;margin-right:6px;background:red;border-radius:50%}
#status{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);display:none;padding:8px 14px;background:rgba(0,0,0,.78);color:#fff;border-radius:5px;font-size:14px;z-index:25;text-align:center}
#controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:10px;background:rgba(0,0,0,.7);border-radius:10px;z-index:15}
.control-btn{min-width:55px;min-height:45px;border:0;border-radius:7px;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer}
.control-btn:hover,.control-btn:focus{background:rgba(255,255,255,.3)}
button:focus{outline:3px solid #fff;outline-offset:3px}
#debug{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);padding:6px 9px;background:rgba(0,0,0,.7);color:#777;font-size:10px;z-index:5;display:none;word-break:break-all}
</style>
</head>
<body>
<div id="player-container">
<video id="video" playsinline webkit-playsinline preload="auto"></video>
<div id="live-badge"><span id="live-dot"></span>LIVE</div>
<div id="loading"><div class="spinner"></div><div id="loading-text">Loading stream...</div></div>
<div id="status"></div>
<div id="error"><h2>Unable to play stream</h2><p id="error-message">The video stream could not be played.</p><button id="retry">Retry</button></div>
<div id="controls">
<button id="playBtn" class="control-btn" aria-label="Play or Pause">▶</button>
<button id="muteBtn" class="control-btn" aria-label="Mute">🔊</button>
<button id="fullscreenBtn" class="control-btn" aria-label="Fullscreen">⛶</button>
</div>
<div id="debug"></div>
</div>

<script>
"use strict";

const video=document.getElementById("video");
const loading=document.getElementById("loading");
const loadingText=document.getElementById("loading-text");
const errorBox=document.getElementById("error");
const errorMessage=document.getElementById("error-message");
const retryButton=document.getElementById("retry");
const liveBadge=document.getElementById("live-badge");
const statusBox=document.getElementById("status");
const playBtn=document.getElementById("playBtn");
const muteBtn=document.getElementById("muteBtn");
const fullscreenBtn=document.getElementById("fullscreenBtn");
const debugBox=document.getElementById("debug");

let hls=null,rawStreamUrl="",currentStreamUrl="",reconnectTimer=null;
let proxyMode=0; // 0 = Direct, 1 = CorsProxy.io, 2 = AllOrigins
let isLoadingStream=false;

function getRawStreamUrl(){
    const params=new URLSearchParams(window.location.search);
    let url=params.get("url")||params.get("src")||params.get("video")||params.get("stream");

    if(!url){
        url="https://d3eyhgoylams0m.cloudfront.net/v1/manifest/93ce20f0f52760bf38be911ff4c91ed02aa2fd92/ed7bd2c7-8d10-4051-b397-2f6b90f99acb/979bc08a-2ad0-4ede-a303-846f6108a776/4.m3u8";
    }

    try{
        if(/%3A|%2F|%3F|%26|%3D/i.test(url)) url=decodeURIComponent(url);
    }catch(e){}

    return url.trim();
}

function buildProxyUrl(target, mode){
    if(!target || mode === 0) return target;
    if(target.includes("corsproxy.io") || target.includes("allorigins.win")) return target;
    
    if(mode === 1){
        return "https://corsproxy.io/?" + encodeURIComponent(target);
    }
    if(mode === 2){
        return "https://api.allorigins.win/raw?url=" + encodeURIComponent(target);
    }
    return target;
}

function showLoading(message){
    loadingText.textContent=message||"Loading stream...";
    loading.style.display="flex";
    errorBox.style.display="none";
}
function hideLoading(){loading.style.display="none"}
function showError(message){
    hideLoading();
    errorMessage.textContent=message||"The video stream could not be played.";
    errorBox.style.display="flex";
    liveBadge.style.display="none";
}
function hideError(){errorBox.style.display="none"}
function showStatus(message){
    statusBox.textContent=message||"";
    statusBox.style.display="block";
    clearTimeout(window.nightflixStatusTimer);
    window.nightflixStatusTimer=setTimeout(()=>statusBox.style.display="none",2200);
}
function setDebug(message){debugBox.textContent=message||""}

function destroyHls(){
    if(hls){
        try{hls.destroy()}catch(e){}
        hls=null;
    }
}

function resetVideo(){
    try{video.pause()}catch(e){}
    try{video.removeAttribute("src");video.load()}catch(e){}
}

function loadStream(){
    if(isLoadingStream) return;
    isLoadingStream=true;
    clearTimeout(reconnectTimer);
    destroyHls();
    resetVideo();
    hideError();
    liveBadge.style.display="none";

    rawStreamUrl=getRawStreamUrl();
    currentStreamUrl=buildProxyUrl(rawStreamUrl, proxyMode);

    const modeLabels=["Connecting Direct...", "Connecting via Proxy 1...", "Connecting via Proxy 2..."];
    showLoading(modeLabels[proxyMode] || "Loading stream...");
    setDebug("Target: " + currentStreamUrl);

    if(window.Hls && Hls.isSupported()){
        hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            xhrSetup: function(xhr, url) {
                xhr.withCredentials = false;
            }
        });

        // Intercept playlist and chunk URLs directly in HLS loader
        hls.config.pLoader = class extends Hls.DefaultConfig.loader {
            load(context, config, callbacks) {
                if(proxyMode > 0) {
                    context.url = buildProxyUrl(context.url, proxyMode);
                }
                super.load(context, config, callbacks);
            }
        };

        hls.config.fLoader = class extends Hls.DefaultConfig.loader {
            load(context, config, callbacks) {
                if(proxyMode > 0) {
                    context.url = buildProxyUrl(context.url, proxyMode);
                }
                super.load(context, config, callbacks);
            }
        };

        hls.on(Hls.Events.MEDIA_ATTACHED, function(){
            try {
                hls.loadSource(currentStreamUrl);
            } catch(e) {
                isLoadingStream=false;
                showError("Could not load HLS source.\n\n"+e.message);
            }
        });

        hls.on(Hls.Events.MANIFEST_PARSED, function(){
            isLoadingStream=false;
            hideLoading();
            hideError();
            liveBadge.style.display="block";
            showStatus(proxyMode === 0 ? "Stream connected" : "Connected via Proxy");
            playVideo();
        });

        hls.on(Hls.Events.FRAG_LOADED, function(){
            if(video.readyState>=2) hideLoading();
        });

        hls.on(Hls.Events.ERROR, function(event, data){
            setDebug("HLS Error: " + (data.details || data.type));

            if(!data.fatal) return;

            if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
                if(proxyMode < 2){
                    proxyMode++;
                    isLoadingStream=false;
                    showStatus("Network restricted, trying Proxy Mode " + proxyMode);
                    loadStream();
                    return;
                }
            }

            if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
                try{ hls.recoverMediaError(); return; }catch(e){}
            }

            isLoadingStream=false;
            showError("Stream load nahi ho pa rahi hai. Provider ne video chunks ko CORS block kiya hua hai.");
        });

        hls.attachMedia(video);
        return;
    }

    if(video.canPlayType("application/vnd.apple.mpegurl")){
        video.src = currentStreamUrl;
        video.load();
        playVideo();
        isLoadingStream=false;
        return;
    }

    isLoadingStream=false;
    showError("HLS playback is not supported by this browser.");
}

function playVideo(){
    video.muted=true;
    const promise=video.play();
    if(promise && typeof promise.then==="function"){
        promise.then(function(){
            hideLoading();
            updatePlayButton();
            updateMuteButton();
        }).catch(function(){
            hideLoading();
            updatePlayButton();
            showStatus("Click Play button to start");
        });
    }
}

function togglePlay(){
    if(video.paused){
        video.play().then(updatePlayButton).catch(()=>showStatus("Play failed"));
    }else{
        video.pause();
        updatePlayButton();
    }
}
function updatePlayButton(){playBtn.textContent=video.paused?"▶":"⏸"}
function toggleMute(){video.muted=!video.muted;updateMuteButton()}
function updateMuteButton(){muteBtn.textContent=(video.muted||video.volume===0)?"🔇":"🔊"}

function toggleFullscreen(){
    const container=document.getElementById("player-container");
    if(document.fullscreenElement||document.webkitFullscreenElement){
        if(document.exitFullscreen)document.exitFullscreen();
        else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    }else{
        if(container.requestFullscreen)container.requestFullscreen();
        else if(container.webkitRequestFullscreen)container.webkitRequestFullscreen();
    }
}

playBtn.addEventListener("click",togglePlay);
muteBtn.addEventListener("click",toggleMute);
fullscreenBtn.addEventListener("click",toggleFullscreen);
retryButton.addEventListener("click",function(){
    proxyMode=0;
    isLoadingStream=false;
    loadStream();
});

video.addEventListener("play",updatePlayButton);
video.addEventListener("pause",updatePlayButton);
video.addEventListener("playing",()=>{hideLoading();liveBadge.style.display="block";});
video.addEventListener("volumechange",updateMuteButton);

loadStream();
</script>
</body>
</html>
