<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07090d">

<title>NIGHTFLIX — LIVE TV</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07090d;
  --text:#f2f5f9;
  --muted:#8994a6;
  --line:#202936;
  --accent:#e50914;
}

body{
  font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
  min-height:100vh;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1440px,100%);
  margin:auto;
  padding:0 24px;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(7,9,13,.82);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.nav{
  height:72px;
  display:flex;
  align-items:center;
  gap:24px;
}

.logo{
  font-size:25px;
  font-weight:950;
  letter-spacing:1.5px;
}

.logo span{
  color:var(--accent);
}

.back{
  font-size:14px;
  color:#aab3c2;
}

.back:hover{
  color:#fff;
}

/* TITLE */

.heading{
  padding:32px 0 20px;
}

.heading h1{
  font-size:clamp(28px,4vw,44px);
}

.heading p{
  margin-top:8px;
  color:var(--muted);
  font-size:13px;
}

/* RED LIVE DOT */

.live-dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff0000;
  margin-right:7px;
  animation:blink 1.1s infinite;
}

@keyframes blink{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.35;
    transform:scale(.75);
  }
}

/* SECTION */

.section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0 14px;
}

.section h2{
  font-size:21px;
}

.badge{
  background:#e50914;
  padding:5px 8px;
  border-radius:5px;
  font-size:10px;
  font-weight:800;
}

/* CHANNEL GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:12px;
  padding-bottom:40px;
}

.card{
  background:#0e1117;
  border:1px solid var(--line);
  border-radius:11px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
  display:flex;
  flex-direction:column;
}

.card:hover,
.card:focus{
  transform:translateY(-4px) scale(1.015);
  border-color:rgba(229,9,20,.8);
  outline:3px solid rgba(229,9,20,.9);
  outline-offset:2px;
  box-shadow:0 10px 28px rgba(0,0,0,.45);
}

/* POSTER */

.poster{
  position:relative;
  aspect-ratio:2/3;
  background:#151b24;
  overflow:hidden;
}

.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* IMAGE ERROR */

.poster-fallback{
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:15px;
  font-weight:900;
  font-size:18px;
}

/* PLAY */

.play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:50px;
  height:50px;
  border-radius:50%;
  background:#e50914;
  display:grid;
  place-items:center;
  font-size:21px;
  box-shadow:0 4px 20px rgba(0,0,0,.45);
}

/* LIVE LABEL */

.live-label{
  position:absolute;
  top:9px;
  left:9px;
  background:#e50914;
  color:white;
  padding:5px 7px;
  border-radius:5px;
  font-size:9px;
  font-weight:900;
}

/* INFO */

.info{
  padding:11px;
  display:flex;
  flex-direction:column;
  flex-grow:1;
}

.title{
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  font-size:10px;
  color:var(--muted);
  margin-top:5px;
}

/* DIRECT PLAY ACTIONS */

.channel-actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.btn-direct, .btn-vlc{
  flex:1;
  text-align:center;
  padding:4px 6px;
  font-size:10px;
  font-weight:700;
  border-radius:4px;
  text-decoration:none;
  border:none;
  cursor:pointer;
  transition:0.2s;
  white-space:nowrap;
}

.btn-direct{
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.18);
  color:#fff;
}

.btn-direct:hover{
  background:var(--accent);
  border-color:var(--accent);
}

.btn-vlc{
  background:#e65100;
  color:#fff;
}

.btn-vlc:hover{
  background:#f57c00;
}

/* EMPTY */

.empty{
  padding:45px 15px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:10px;
  margin-bottom:40px;
}

/* RESPONSIVE */

@media(max-width:1200px){
  .grid{
    grid-template-columns:repeat(6,minmax(0,1fr));
  }
}

@media(max-width:1000px){
  .grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }
}

@media(max-width:760px){
  .container{
    padding:0 15px;
  }
  .nav{
    height:62px;
  }
  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:9px;
  }
}

@media(max-width:500px){
  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
  }
  .title{
    font-size:10px;
  }
  .btn-direct, .btn-vlc{
    font-size:9px;
    padding:3px 4px;
  }
}

@media(max-width:350px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<header>
  <div class="container nav">
    <a class="logo" href="index.html">
      NIGHT<span>FLIX</span>
    </a>
    <a class="back" href="index.html">
      ← Back to Movies
    </a>
  </div>
</header>

<main class="container">
  <section class="heading">
    <h1>
      <span class="live-dot"></span>
      LIVE TV
    </h1>
    <p>Live channels</p>
  </section>

  <div class="section">
    <h2>Live Channels</h2>
    <span class="badge">LIVE</span>
  </div>

  <div id="grid" class="grid"></div>

  <div id="empty" class="empty" style="display:none;">
    No LIVE TV channels found.
  </div>
</main>

<script>
"use strict";

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");

function isLiveChannel(item){
  if(!item || typeof item !== "object") return false;
  const type = String(
    item.contentType ||
    item.type ||
    item.categoryType ||
    ""
  ).toLowerCase().replace(/[\s_-]/g,"");

  return (
    type === "live" ||
    type === "livetv" ||
    type === "livechannel" ||
    item.live === true ||
    item.isLive === true
  );
}

function safe(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function loadLiveChannels(){
  try{
    const response = await fetch("movies.json", {cache:"no-store"});
    if(!response.ok){
      throw new Error("movies.json HTTP " + response.status);
    }

    const data = await response.json();
    if(!Array.isArray(data)){
      throw new Error("movies.json format invalid");
    }

    const channels = data.filter(isLiveChannel);
    if(channels.length === 0){
      empty.style.display = "block";
      return;
    }

    grid.innerHTML = channels.map((channel,index)=>{
      const title = channel.title || "Live Channel";
      const poster = channel.poster || "";
      const category = channel.genre || channel.category || "Live TV";
      const stream = channel.watch || channel.stream || channel.url || channel.link || "";

      return `
        <article class="card" tabindex="0" data-index="${index}">
          <div class="poster">
            <img src="${safe(poster)}" alt="${safe(title)}" loading="lazy">
            <div class="poster-fallback">${safe(title)}</div>
            <div class="live-label">● LIVE</div>
            <div class="play">▶</div>
          </div>

          <div class="info">
            <div class="title">${safe(title)}</div>
            <div class="meta">${safe(category)} • Live</div>

            <!-- CHOTA DIRECT PLAY OPTION -->
            <div class="channel-actions">
              <a href="${safe(stream)}" target="_blank" class="btn-direct direct-link" title="Open Stream Directly" onclick="event.stopPropagation();">
                🔗 Direct
              </a>
              <a href="vlc://${safe(stream)}" class="btn-vlc vlc-link" title="Open in VLC" onclick="event.stopPropagation();">
                VLC
              </a>
            </div>
          </div>
        </article>
      `;
    }).join("");

    /* IMAGE ERROR HANDLER */
    document.querySelectorAll(".poster img").forEach(img=>{
      img.addEventListener("error", function(){
        this.style.display = "none";
        const fallback = this.nextElementSibling;
        if(fallback){
          fallback.style.display = "flex";
        }
      });
    });

    /* CLICK + REMOTE */
    document.querySelectorAll(".card").forEach((card,index)=>{
      function openChannel(){
        const channel = channels[index];
        const stream = channel.watch || channel.stream || channel.url || channel.link || "";
        if(!stream){
          alert("Is channel ka watch/stream URL movies.json me nahi hai.");
          return;
        }
        window.location.href = "live-player.html?url=" + encodeURIComponent(stream);
      }

      card.addEventListener("click", function(event){
        // Agar Direct ya VLC link par click hua ho to normal player open na ho
        if(event.target.closest('.channel-actions')) return;
        openChannel();
      });

      card.addEventListener("keydown", event=>{
        if(event.key === "Enter" || event.key === " "){
          if(event.target.closest('.channel-actions')) return;
          event.preventDefault();
          openChannel();
        }
      });
    });

    /* TV REMOTE NAVIGATION */
    const cards = Array.from(document.querySelectorAll(".card"));
    function getColumns(){
      if(cards.length < 2) return 1;
      const firstTop = cards[0].getBoundingClientRect().top;
      const tolerance = 8;
      const count = cards.filter(card =>
        Math.abs(card.getBoundingClientRect().top - firstTop) <= tolerance
      ).length;
      return Math.max(1, count);
    }

    cards.forEach((card,index)=>{
      card.addEventListener("keydown", event=>{
        let target = -1;
        const columns = getColumns();

        if(event.key === "ArrowRight") target = index + 1;
        if(event.key === "ArrowLeft") target = index - 1;
        if(event.key === "ArrowDown") target = index + columns;
        if(event.key === "ArrowUp") target = index - columns;

        if(target >= 0 && target < cards.length){
          event.preventDefault();
          cards[target].focus({preventScroll:true});
          cards[target].scrollIntoView({
            behavior:"smooth",
            block:"nearest",
            inline:"nearest"
          });
        }
      });
    });

    if(cards[0]) cards[0].focus({preventScroll:true});

  }
  catch(error){
    console.error(error);
    empty.style.display = "block";
    empty.textContent = "LIVE channels load nahi hue. movies.json check karein.";
  }
}

loadLiveChannels();
</script>

<!-- NIGHTFLIX CASUAL DEVTOOLS PROTECTION -->
<script>
(function () {
  "use strict";

  document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
  }, { capture: true });

  document.addEventListener("dragstart", function (e) {
    e.preventDefault();
  }, { capture: true });

  document.addEventListener("keydown", function (e) {
    var key = String(e.key || "").toLowerCase();
    var code = String(e.code || "").toLowerCase();

    if (e.key === "F12" || code === "f12") {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }

    if (e.ctrlKey && e.shiftKey && (key === "i" || key === "j" || key === "c")) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }

    if (e.ctrlKey && key === "u") {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }

    if (e.ctrlKey && key === "s") {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, { capture: true });

  var style = document.createElement("style");
  style.textContent = `
    body, body * {
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }
    input, textarea, select, [contenteditable="true"] {
      -webkit-user-select: text !important;
      user-select: text !important;
      -webkit-touch-callout: default !important;
    }
    img, video {
      -webkit-user-drag: none !important;
      user-drag: none !important;
    }
  `;
  (document.head || document.documentElement).appendChild(style);

  window.addEventListener("contextmenu", function (e) {
    e.preventDefault();
  }, true);
})();
</script>

</body>
</html>
