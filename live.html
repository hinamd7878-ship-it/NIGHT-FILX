<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07090d">

<title>NIGHTFLIX — LIVE TV</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07090d;
  --text:#f2f5f9;
  --muted:#8994a6;
  --line:#202936;
  --accent:#e50914;
}

body{
  font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
  min-height:100vh;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1440px,100%);
  margin:auto;
  padding:0 24px;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(7,9,13,.82);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.nav{
  height:72px;
  display:flex;
  align-items:center;
  gap:24px;
}

.logo{
  font-size:25px;
  font-weight:950;
  letter-spacing:1.5px;
}

.logo span{
  color:var(--accent);
}

.back{
  font-size:14px;
  color:#aab3c2;
}

.back:hover{
  color:#fff;
}

/* TITLE */

.heading{
  padding:32px 0 20px;
}

.heading h1{
  font-size:clamp(28px,4vw,44px);
}

.heading p{
  margin-top:8px;
  color:var(--muted);
  font-size:13px;
}

/* RED LIVE DOT */

.live-dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff0000;
  margin-right:7px;
  animation:blink 1.1s infinite;
}

@keyframes blink{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.35;
    transform:scale(.75);
  }
}

/* SECTION */

.section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0 14px;
}

.section h2{
  font-size:21px;
}

.badge{
  background:#e50914;
  padding:5px 8px;
  border-radius:5px;
  font-size:10px;
  font-weight:800;
}

/* CHANNEL GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:12px;
  padding-bottom:40px;
}

.card{
  background:#0e1117;
  border:1px solid var(--line);
  border-radius:11px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover,
.card:focus{
  transform:translateY(-4px);
  border-color:rgba(229,9,20,.55);
  outline:none;
}

/* POSTER */

.poster{
  position:relative;
  aspect-ratio:2/3;
  background:#151b24;
  overflow:hidden;
}

.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* IMAGE ERROR */

.poster-fallback{
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:15px;
  font-weight:900;
  font-size:18px;
}

/* PLAY */

.play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:50px;
  height:50px;
  border-radius:50%;
  background:#e50914;
  display:grid;
  place-items:center;
  font-size:21px;
  box-shadow:0 4px 20px rgba(0,0,0,.45);
}

/* LIVE LABEL */

.live-label{
  position:absolute;
  top:9px;
  left:9px;
  background:#e50914;
  color:white;
  padding:5px 7px;
  border-radius:5px;
  font-size:9px;
  font-weight:900;
}

/* INFO */

.info{
  padding:11px;
}

.title{
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  font-size:10px;
  color:var(--muted);
  margin-top:7px;
}

/* EMPTY */

.empty{
  padding:45px 15px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:10px;
  margin-bottom:40px;
}

/* RESPONSIVE */

@media(max-width:1200px){

  .grid{
    grid-template-columns:repeat(6,minmax(0,1fr));
  }

}

@media(max-width:1000px){

  .grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }

}

@media(max-width:760px){

  .container{
    padding:0 15px;
  }

  .nav{
    height:62px;
  }

  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:9px;
  }

}

@media(max-width:500px){

  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
  }

  .title{
    font-size:10px;
  }

}

@media(max-width:350px){

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

}

/* NIGHTFLIX TV REMOTE FOCUS */
.movie:focus, .card:focus {
  outline: 3px solid #ff0000;
  outline-offset: 3px;
  transform: translateY(-4px) scale(1.015);
  scroll-margin: 90px;
  z-index: 5;
}
.movie, .card {
  transition: transform .18s ease, box-shadow .18s ease, outline-color .18s ease;
}
@media (prefers-reduced-motion: reduce) {
  .movie, .card { transition: none !important; }
}
</style>
</head>

<body>

<header>

  <div class="container nav">

    <a class="logo" href="index.html">
      NIGHT<span>FLIX</span>
    </a>

    <a class="back" href="index.html">
      ← Back to Movies
    </a>

  </div>

</header>


<main class="container">

  <section class="heading">

    <h1>
      <span class="live-dot"></span>
      LIVE TV
    </h1>

    <p>
      Live channels
    </p>

  </section>


  <div class="section">

    <h2>
      Live Channels
    </h2>

    <span class="badge">
      LIVE
    </span>

  </div>


  <div id="grid" class="grid"></div>


  <div id="empty" class="empty" style="display:none;">
    No LIVE TV channels found.
  </div>

</main>


<script>

"use strict";


const grid =
document.getElementById("grid");

const empty =
document.getElementById("empty");


/* CHECK LIVE CHANNEL */

function isLiveChannel(item){

  const type =
    String(item.contentType || "")
    .toLowerCase()
    .replace(/[\s_-]/g,"");

  return (
    type === "live" ||
    type === "livetv" ||
    type === "livechannel"
  );

}


/* SAFE TEXT */

function safe(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* LOAD MOVIES.JSON */

async function loadLiveChannels(){

  try{

    const response =
      await fetch(
        "movies.json",
        {cache:"no-store"}
      );


    if(!response.ok){

      throw new Error(
        "movies.json HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(!Array.isArray(data)){

      throw new Error(
        "movies.json format invalid"
      );

    }


    /* ONLY LIVE ITEMS */

    const channels =
      data.filter(isLiveChannel);


    if(channels.length === 0){

      empty.style.display = "block";

      return;

    }


    /* CREATE CARDS */

    grid.innerHTML =
      channels.map((channel,index)=>{

        const title =
          channel.title ||
          "Live Channel";


        const poster =
          channel.poster ||
          "";


        const category =
          channel.genre ||
          channel.category ||
          "Live TV";


        const stream =
          channel.watch ||
          channel.stream ||
          "";


        return `

          <article
            class="card"
            tabindex="0"
            data-index="${index}"
          >

            <div class="poster">

              <img
                src="${safe(poster)}"
                alt="${safe(title)}"
                loading="lazy"
              >

              <div
                class="poster-fallback"
              >
                ${safe(title)}
              </div>


              <div class="live-label">
                ● LIVE
              </div>


              <div class="play">
                ▶
              </div>

            </div>


            <div class="info">

              <div class="title">
                ${safe(title)}
              </div>

              <div class="meta">
                ${safe(category)} • Live
              </div>

            </div>

          </article>

        `;

      }).join("");


    /* IMAGE ERROR HANDLER */

    document
      .querySelectorAll(".poster img")
      .forEach(img=>{

        img.addEventListener(
          "error",
          function(){

            this.style.display = "none";

            const fallback =
              this.nextElementSibling;

            if(fallback){

              fallback.style.display =
                "flex";

            }

          }
        );

      });


    /* CLICK + TV REMOTE */

    document
      .querySelectorAll(".card")
      .forEach((card,index)=>{

        function openChannel(){

          const channel =
            channels[index];


          const stream =
            channel.watch ||
            channel.stream ||
            "";


          if(!stream){

            alert(
              "Is channel ka watch/stream URL movies.json me nahi hai."
            );

            return;

          }


          window.location.href =
            "live-player.html?url=" +
            encodeURIComponent(stream);

        }


        card.addEventListener(
          "click",
          openChannel
        );


        card.addEventListener(
          "keydown",
          event=>{

            const cards = Array.from(document.querySelectorAll(".card"));
          const current = cards.indexOf(card);
          const firstTop = cards[0]?.getBoundingClientRect().top ?? 0;
          const columns = Math.max(1, cards.filter(c => Math.abs(c.getBoundingClientRect().top - firstTop) < 8).length);
          let target = -1;

          if(event.key === "ArrowRight") target = current + 1;
          else if(event.key === "ArrowLeft") target = current - 1;
          else if(event.key === "ArrowDown") target = current + columns;
          else if(event.key === "ArrowUp") target = current - columns;
          else if(event.key === "Enter" || event.key === " "){
            event.preventDefault();
            openChannel();
            return;
          } else return;

          if(target >= 0 && target < cards.length){
            event.preventDefault();
            cards[target].focus({preventScroll:true});
            cards[target].scrollIntoView({behavior:"smooth", block:"nearest", inline:"nearest"});
          }

          }
        );

      });


  }
  catch(error){

    console.error(error);

    empty.style.display =
      "block";

    empty.textContent =
      "movies.json load nahi hua.";

  }

}


/* START */

loadLiveChannels();


<script>
/* NIGHTFLIX: basic shortcut/right-click deterrent.
   This cannot hide network requests or stream URLs from a determined user. */
(function(){
  document.addEventListener("contextmenu", e => e.preventDefault(), true);
  document.addEventListener("dragstart", e => e.preventDefault(), true);
  document.addEventListener("keydown", function(e){
    const k = String(e.key || "").toLowerCase();
    if (k === "f12" || (e.ctrlKey && e.shiftKey && ["i","j","c"].includes(k)) || (e.ctrlKey && k === "u")) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
})();
</script>
</script>

</body>
</html>
